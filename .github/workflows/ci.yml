name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit & surface tests
        run: pytest -q

      - name: Start control-plane server
        run: |
          OM_LLM_MODE=mock OM_DATA_DIR=/tmp/om-ci python -c "
          from openmesha.main import create_app
          import uvicorn
          uvicorn.run(create_app(), host='127.0.0.1', port=8080, log_level='warning')
          " &
          echo $! > /tmp/om-server.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "server healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to become healthy"
          exit 1

      - name: Full verify contract
        run: bash scripts/verify.sh
        env:
          OM_URL: http://127.0.0.1:8080
          PYTHONPATH: src
