    return pj.tool("journal_report").then(function(rep){
      $("pj-report").textContent = rep;
      window.__PJ_BASE = "\n\nPALIMPSEST (persistent skill journal - live):\n" + rep +
        "\n(Read/search/capture via the Palimpsest tab; OM code: window.OM_PALIMPSEST)";
      window.__PJ_STATE = window.__PJ_BASE;
      status("connected - snapshot feeding the copilot", true);
      syncGalaxy();
    });
  }
  function connect(){
    var url = $("pj-url").value.trim();
    if (!url) { status("set the /mcp/<secret> endpoint first", false); return; }
    localStorage.setItem(LSK, url);
    pj = new PJClient(url);
    status("connecting...", false);
    refresh().then(function(){
      slog("connected");
      if (timer) clearInterval(timer);
      timer = setInterval(function(){ refresh().catch(function(){}); }, 120000);
    }).catch(function(e){ pj = null; status("failed: " + e.message + " (CORS? ALLOWED_ORIGIN must equal the origin above)", false); bundledDone = false; bundledBoot(); });
  }
  $("pj-connect").addEventListener("click", connect);

  /* ---- search + read ---- */
  $("pj-q").addEventListener("keydown", function(ev){
    if (ev.key !== "Enter") return;
    if (!pj) { localSearch($("pj-q").value); return; }
    pj.tool("search_skills", { query: $("pj-q").value, top: 5 }).then(function(out){
      var res = $("pj-res"); res.innerHTML = ""; $("pj-view").style.display = "none";
      var lines = out.split("\n").filter(function(l){ return /^\d/.test(l.trim()); });
      if (!lines.length) { res.appendChild(h("div","pj-hint","No lesson matches - a surprise here is a capture opportunity.")); return; }
      lines.forEach(function(l){
        var name = l.trim().split(/\s+/)[1];
        var row = h("div", { "class":"pj-hit" }, esc(name) + ' <span class="pj-m">' + esc(l.trim().split(/\s+/).slice(2).join(" ")) + "</span>");
        row.addEventListener("click", function(){
          pj.tool("get_skill", { name:name }).then(function(body){
            ledgerBump("lesson");
            var v = $("pj-view"); v.textContent = body; v.style.display = "block";
          }).catch(function(e){ slog("read failed: " + e.message); });
        });
        res.appendChild(row);
      });
    }).catch(function(e){ slog("search failed: " + e.message); });
  });

  /* ---- capture (always human-initiated or human-confirmed) ---- */
  function doCapture(title, trigger, lesson, evidence){
    if (!pj) { status("connect first", false); return Promise.reject(new Error("not connected")); }
    var args = { title:title, trigger:trigger, lesson:lesson };
    if (evidence) args.evidence = [evidence];
    return pj.tool("capture_lesson", args).then(function(out){
      slog("captured: " + title); refresh().catch(function(){}); return out;
    });
  }
  $("pj-cap").addEventListener("click", function(){
    doCapture($("pj-t").value, $("pj-w").value, $("pj-l").value, $("pj-e").value)
      .then(function(){ ["pj-t","pj-w","pj-l","pj-e"].forEach(function(i){ $(i).value = ""; }); })
      .catch(function(e){ slog("capture failed: " + e.message); });
  });

  /* ---- surprise queue: errors become capture candidates, never auto-writes ---- */
  function surprise(kind, msg){
    if (!msg || $("pj-sur").children.length >= 5) return;
    var li = h("li", null, "<b>" + esc(kind) + "</b> " + esc(String(msg).slice(0, 140)) + " ");
    var cap = h("button", { type:"button" }, "Capture");
    var dis = h("button", { type:"button" }, "Dismiss");
    cap.addEventListener("click", function(){
      $("pj-t").value = kind + ": " + String(msg).slice(0, 60);
      $("pj-w").value = "OpenMesha raised this " + kind + " again";
      $("pj-l").value = "TODO distill: what actually went wrong, and what fixes it? Raw: " + String(msg).slice(0, 200);
      panel.classList.add("pj-open"); li.remove();
    });
    dis.addEventListener("click", function(){ li.remove(); });
    li.appendChild(cap); li.appendChild(dis);
    $("pj-sur").appendChild(li);
  }
  /* 10X roadmap item 1 (event-driven triggers): observe the mesh's own action
     stream and turn high-signal events into capture CANDIDATES. Observation
     only - confirmation stays human, promotion stays in the repo. */
  window.addEventListener("om-action", function(e){
    var d = e.detail || {};
    if (d.kind === "security" || (d.text && /fail|breach|rejected|rollback/i.test(d.text)))
      surprise("signal", (d.kind || d.type || "event") + ": " + (d.text || "").slice(0, 120));
  });
  window.addEventListener("error", function(e){ surprise("error", e.message); });
  window.addEventListener("unhandledrejection", function(e){
    surprise("rejection", (e.reason && (e.reason.message || e.reason)) || "unhandled rejection"); });

  /* ---- API for OpenMesha's own subsystems (Improve, Council, Router) ---- */
  window.OM_PALIMPSEST = {
    client: function(){ return pj; },
    connect: connect,
    refresh: refresh,
    syncGalaxy: syncGalaxy,
    search: function(q, top){ return pj.tool("search_skills", { query:q, top:top||5 }); },
    getSkill: function(n){ return pj.tool("get_skill", { name:n }); },
    plan: function(task, depth){ return pj.tool("journal_plan", { task:task, depth:depth||3 }); },
    capture: doCapture,
    recordSignal: function(o){ return pj.tool("record_signal", o).then(function(r){ slog("signal: " + o.skill + (o.positive?" +":o.negative?" -":"")); return r; }); },
    ledger: function(){ return { counts: ledger, valueUSD: +ledgerValue().toFixed(2), prices: PJ_PRICES }; },
    recordOutcome: function(skills, ok, note, valueUSD){
      if (ok && valueUSD) ledgerBump("extra", +valueUSD);
      return this._record(skills, ok, note);
    },
    _record: function(skills, ok, note){
      var chain = Promise.resolve();
      (skills||[]).forEach(function(sk){
        chain = chain.then(function(){ return window.OM_PALIMPSEST.recordSignal(
          { skill:sk, applied:true, positive:!!ok, negative:!ok, note:note||"" }); });
      });
      return chain;
    }
  };

  /* Roadmap #6 mechanism: internal market for context. Candidate lessons BID
     (bid = relevance score); the budget clears highest bids first at Stage-7
     prices, charging the ledger per loaded lesson. Pure function, gate-tested. */
  function pjMarketSelect(cands, budget){
    var sorted = cands.slice().sort(function(a, b){ return b.score - a.score; });
    var picked = [], spend = 0;
    for (var i = 0; i < sorted.length; i++) {
      var price = PJ_PRICES.search;
      if (spend + price > budget) break;
      picked.push(sorted[i]); spend += price;
    }
    return { picked: picked, spend: +spend.toFixed(2), bids: sorted.length };
  }

  /* Automated read path: called by the copilot before every reply (splice D).
     Injects the top lessons for the user's current question into SYSTEM STATE.
     Bounded at 1.5s so the copilot never stalls on the journal. */
  window.OM_PALIMPSEST_PREP = function(hist){
    if (!pj) return Promise.resolve();
    var last = "";
    for (var i = (hist||[]).length - 1; i >= 0; i--) {
      var m = hist[i];
      if (m && m.role === "user") {
        var c = m.content;
        last = typeof c === "string" ? c :
          (Array.isArray(c) ? c.map(function(b){ return (b && b.text) || ""; }).join(" ") : "");
        break;
      }
    }
    var base = window.__PJ_BASE || "";
    if (!last) { window.__PJ_STATE = base; return Promise.resolve(); }
    return Promise.race([
      pj.tool("search_skills", { query: last, top: 6 }),
      new Promise(function(_, rej){ setTimeout(function(){ rej(new Error("pj timeout")); }, 1500); })
    ]).then(function(hits){
      var cands = [];
      hits.split("\n").forEach(function(l){
        var m = l.match(/^([\d.]+)  (\S+)  \[/);
        if (m) cands.push({ score: parseFloat(m[1]), line: l });
      });
      var mkt = pjMarketSelect(cands, 0.06);   /* budget: 3 lessons at pj.search rate */
      var chosen = mkt.picked.map(function(c){ return c.line; }).join("\n");
      window.__PJ_STATE = base + "\n\nRELEVANT LESSONS (market-cleared " + mkt.picked.length + "/" + mkt.bids + " bids, $" + mkt.spend + "):\n" + chosen;
      for (var i = 0; i < mkt.picked.length; i++) ledgerBump("search");
    }).catch(function(){ window.__PJ_STATE = base; });
  };

  /* Knowledge Galaxy projection: every lesson becomes a wiki page under the
     pj- provenance prefix; replaced wholesale each sync (never appended), so
     deprecated lessons drop out. One-way: the Galaxy never writes back. */
  var galaxyNotified = false;
  function humanize(name){
    return name.split("-").map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1); }).join(" ");
  }
  function buildPjPages(lessons, originNote){
    var pages = [], titles = [];
    lessons.forEach(function(l){
      var title = humanize(l.name);
      var links = (l.links || []).map(humanize);
      var lede = (l.trigger || "").trim();
      if (lede && !/[.!?]$/.test(lede)) lede += ".";
      var body = "# " + title + "\n" + lede +
        "\n\nIn the journal this stands as a " + l.status + " lesson with an effective trust of " + l.eff +
        " - a score that decays unless the lesson keeps earning honest positive signals." +
        (links.length ? " It works alongside " + links.map(function(t){ return "[[" + t + "]]"; }).join(" and ") + "." : "") +
        "\n\nPart of the [[PALIMPSEST Journal]] (" + originNote + "). This page is a one-way projection: the canonical copy lives in the repository, where every edit lands as a gated git layer.";
      pages.push({ slug:"pj-" + l.name, title:title, sys:"improve", group:"Learning",
                   tags:["palimpsest", l.status], body:body });
      titles.push(title);
    });
    if (!pages.length) return null;
    var RX = [
      ["pj-10x-roadmap","10X Roadmap","improve","Learning","The mesh's compounding path: plural deliberation, a verified memory flywheel, deeper substrates, and order-of-magnitude faster loops - every workstream tracked with an honest status, every safeguard kept hard. Shipped at this seam: [[Event-Driven Capture]], Council priors, per-question copilot lessons, the shared-journal federation seed, and [[Palimpsest Economics]]. The invariant is verbatim policy: any proposal that weakens HOTL, AgentFence, append-only verified knowledge, or outcome-fee verification is rejected."],
      ["pj-10x-capture","Event-Driven Capture","improve","Learning","SHIPPED - the kernel's action stream is observed and high-signal events (security verdicts, failures, rollbacks) become one-tap capture candidates in [[Palimpsest]]. Confirmation stays human; nothing self-promotes. This is the roadmap's first immediate item: feedback loops shortened from manual entry to a single tap."],
      ["pj-10x-council","Plural Council Societies","agent","Agents","SHIPPED (verified) - every vote now triggers a dynamic sub-council: three specialist knowledge passes (direct, risk, verification-economics) queried in parallel and synthesized into one prior block per seat, plus a propose-only WEIGHT ADVISORY computed from the journal track record for that domain. Spawning additional LLM seats remains a WIRE seam, per the mesh doctrine."],
      ["pj-10x-memory","Verified Memory Flywheel","mem","Memory","SHIPPED (verified) - retrieval v4 is live with REAL corpus-trained embeddings (LSA over the lesson corpus) blended into graph-spread temporal scoring, accepted by the golden gate at hit-at-three five to eight of twelve. Auto-distillation drafts every capture; federation transport ships as a2a pull with a hard rule - imported lessons land as drafts, trust is re-earned locally, never imported. Neural embedding models remain an optional upgrade."],
      ["pj-10x-reasoning","Deep Reasoning Substrates","quantum","Quantum","SHIPPED (verified) - journal_plan runs true beam search over the lesson graph seeded by retrieval priors, returning ordered multi-step plans that include graph-linked lessons the raw query would miss; the universal outcome gate now exists as tooling, so any substrate win (kernel, quantum, sibling) must beat its baseline to ship - ties refuse. Hardware execution stays WIRE, as the mesh itself marks it."],
      ["pj-10x-evolution","Parallel Foundry Evolution","compute","Compute","SHIPPED (verified) - the promotion machinery is live and battle-tested: versioned algorithms (v1 through v4), a universal gate that REJECTED two candidates (v2 scored worse; a tie refused by construction) and accepted two verified wins, plus multi-writer provenance so parallel improvement instances report into one audited ledger. Foundry-spawned sibling fleets remain WIRE; the rails they must run on are shipped."],
      ["pj-10x-safety","10X Safety Invariants","sec","Security","ENFORCED and SHIPPED - acceleration never touches the gates: HOTL and kill switch stay hard, knowledge stays append-only, revenue moves only on a human tap, trust has no price, and federation imports arrive powerless (drafts). The red-team battery is now automated: every test run fires hostile payload fuzzing across all write and read tools - forty-five checks, zero exceptions. Any 10X proposal that weakens these is rejected - verbatim policy."]
    ];
    RX.forEach(function(r){ pages.push({ slug:r[0], title:r[1], sys:r[2], group:r[3], tags:["palimpsest","10x"], body:"# "+r[1]+"\n"+r[4] }); });
    pages.push({ slug:"pj-economics", title:"Palimpsest Economics", sys:"econ", group:"Economy",
      tags:["palimpsest","economy"],
      body:"# Palimpsest Economics\nJournal access is priced through the same Stage-7 growth streams as every other subsystem: pj.search at $0.02, pj.lesson at $0.05, and pj.snapshot at $0.50, with external agents served over the x402 seam (USDC on Base, scheme exact; settlement is a WIRE seam and entitlements are owner-minted).\n\nAccrued value is credited to [[Revenue]] only on explicit Human-on-the-Loop approval - the journal never moves value on its own. And one rule has no price: trust. Promotion cannot be bought; verification is the only currency that moves a lesson toward stable.\n\nPart of the [[PALIMPSEST Journal]]." });
    pages.unshift({ slug:"pj-journal", title:"PALIMPSEST Journal", sys:"improve", group:"Learning",
      tags:["palimpsest","journal"],
      body:"# PALIMPSEST Journal\nThe mesh's persistent skill journal - verified lessons that outlive any single session, each carrying provenance, a live trust score, and decay. The copilot consults it before answering and the Council receives its priors before voting; writes from this app are capture and signal only, so nothing self-promotes.\n\nLessons currently projected (" + originNote + "): " +
           titles.map(function(t){ return "[[" + t + "]]"; }).join(" ") +
           "\n\nStatus and trust refresh on every sync, and deprecated lessons leave this galaxy on their own. The compounding path forward lives in the [[10X Roadmap]]." });
    return pages;
  }
  function dispatchPjPages(pages, label){
    if (!pages) return;
    whenReady(function(){ return window.__OM_DISPATCH; }, function(dispatch){
      dispatch({ type:"PJ_WIKI_MERGE", pages:pages });
      if (!galaxyNotified) {
        galaxyNotified = true;
        dispatch({ type:"NOTIFY", n:{ kind:"wiki", text:"Knowledge Galaxy: " + (pages.length - 1) + " Palimpsest lessons (" + label + ")" } });
      }
      slog("galaxy: " + (pages.length - 1) + " lessons (" + label + ")");
    });
  }
  function syncGalaxy(){
    if (!pj) return Promise.resolve();
    return pj.tool("list_skills").then(function(out){
      var lines = out.split("\n"), lessons = [];
      for (var i = 0; i < lines.length - 1; i++) {
        var m = lines[i].match(/^(\S+)\s+\[(\w+)\] eff=([\d.]+)(?: links=(\S*))?/);
        if (!m) continue;
        if (m[2] === "draft" || m[2] === "deprecated" || m[2] === "retired") continue;
        lessons.push({ name:m[1], status:m[2], eff:m[3],
          links:(m[4] || "").split(",").filter(Boolean), trigger:(lines[i+1] || "").trim() });
      }
      dispatchPjPages(buildPjPages(lessons, "live"), "live");
    }).catch(function(e){ slog("galaxy sync failed: " + e.message); });
  }

  /* Bundled snapshot: the journal shipped inside this file. Read path works
     with zero infrastructure; Connect later replaces it with live data. */
  var bundledDone = false;
  function bundledBoot(){
    var B = window.__PJ_BUNDLED;
    if (pj || bundledDone || !B) return;
    bundledDone = true;
    var st = B.stats || {};
    $("pj-report").textContent = "Bundled snapshot - " + B.generated +
      "\nlessons: " + (st.total || 0) + " (" +
      Object.keys(st.byStatus || {}).map(function(k){ return st.byStatus[k] + " " + k; }).join(", ") +
      ")\nmean trust: " + st.meanEff + "\n\nConnect for live data, full lesson bodies, and writes.";
    status("offline snapshot " + B.generated + " - Connect for live", false);
    window.__PJ_STATE = "\n\nPALIMPSEST (bundled snapshot " + B.generated + "):\n" +
      (B.skills || []).map(function(l){ return l.name + " [" + l.status + "] eff=" + l.eff + " - " + l.trigger; }).join("\n") +
      "\n(Read-only snapshot; connect the journal endpoint for live state and writes.)";
    dispatchPjPages(buildPjPages(B.skills || [], "snapshot " + B.generated), "snapshot");
  }
  function localSearch(q){
    var B = window.__PJ_BUNDLED;
    if (!B) return;
    var W = { stable:1.0, candidate:0.85 };
    var qt = (q.toLowerCase().match(/[a-z0-9]+/g) || []);
    var rows = [];
    (B.skills || []).forEach(function(l){
      var w = W[l.status]; if (!w || !qt.length) return;
      var hay = (l.name.replace(/-/g," ") + " " + (l.desc||"") + " " + (l.links||[]).join(" ")).toLowerCase();
      var hit = 0; qt.forEach(function(t){ if (hay.indexOf(t) > -1) hit++; });
      var rel = hit / qt.length; if (!rel) return;
      var rec = Math.pow(.5, (l.days || 0) / 180);
      rows.push([ +(w * (0.6*rel + 0.25*l.eff + 0.15*rec)).toFixed(3), l ]);
    });
    rows.sort(function(a,b){ return b[0]-a[0]; });
    var res = $("pj-res"); res.innerHTML = ""; $("pj-view").style.display = "none";
    if (!rows.length) { res.appendChild(h("div","pj-hint","No lesson matches in the snapshot.")); return; }
    rows.slice(0,5).forEach(function(pair){
      var l = pair[1];
      var row = h("div", { "class":"pj-hit" }, esc(l.name) + ' <span class="pj-m">' + pair[0].toFixed(3) + " [" + esc(l.status) + "] eff=" + l.eff + "</span>");
      row.addEventListener("click", function(){
        var v = $("pj-view"); v.textContent = l.desc + "\n\n(snapshot - connect for the full lesson body)"; v.style.display = "block";
      });
      res.appendChild(row);
    });
  }

    $("pj-credit").addEventListener("click", function(){
    var v = +ledgerValue().toFixed(2);
    if (!v) { slog("ledger empty - nothing to credit"); return; }
    whenReady(function(){ return window.__OM_DISPATCH; }, function(dispatch){
      dispatch({ type:"NOTIFY", n:{ kind:"pay", text:"Palimpsest services " + ledger.search + "s/" + ledger.lesson + "l/" + ledger.council + "c - $" + v + " (HOTL approved)" } });
      dispatch({ type:"REVENUE", amount: v });
      slog("credited $" + v + " to Revenue (HOTL)");
      ledger = { search:0, lesson:0, council:0, extra:0 }; ledgerBump("extra", 0);
    });
  });

  /* Council priors (splice G/H): verified lessons relevant to a proposal,
     handed to every seat before it votes. Bounded at 1.2s; empty on miss. */
  window.OM_PALIMPSEST_COUNCIL = function(proposal){
    if (!pj) return Promise.resolve("");
    var q = String(proposal).slice(0, 300);
    /* Roadmap #7 mechanism: a dynamic SUB-COUNCIL of knowledge passes - three
       specialist angles queried in parallel, synthesized into one prior block.
       Spawning additional LLM seats stays OM-core (WIRE). */
    var angles = [q, "risks and failure modes: " + q, "verification and economics: " + q];
    return Promise.race([
      Promise.all(angles.map(function(a){ return pj.tool("search_skills", { query: a, top: 2 }).catch(function(){ return ""; }); })),
      new Promise(function(_, rej){ setTimeout(function(){ rej(new Error("pj timeout")); }, 1400); })
    ]).then(function(all){
      var seen = {}, lines = [];
      all.join("\n").split("\n").forEach(function(l){
        var m = l.match(/^([\d.]+)  (\S+)  \[(\w+)\]/);
        if (m && !seen[m[2]]) { seen[m[2]] = true; lines.push(l); }
      });
      if (!lines.length) return "";
      ledgerBump("council");
      var eff = lines.map(function(l){ return parseFloat((l.match(/eff=([\d.]+)/) || [0, 0])[1]); });
      var mean = eff.reduce(function(a, b){ return a + b; }, 0) / eff.length;
      return "\n\nVERIFIED PRIORS - sub-council synthesis across " + Object.keys(seen).length +
        " lessons (weigh these in your vote):\n" + lines.slice(0, 4).join("\n") +
        "\nWEIGHT ADVISORY (propose-only): journal track record for this domain averages " + mean.toFixed(2) +
        " - weigh your vote confidence accordingly.";
    }).catch(function(){ return ""; });
  };

  if ($("pj-url").value) connect(); else bundledBoot();
})();
</script>
<script id="om-wire-adoption-module">
/* ============================================================================
   OM WIRE · Adoption Module v0.6.0 — append-only integration
   ----------------------------------------------------------------------------
   SAFETY INVARIANTS (do not weaken):
   1. Append-only: zero bytes of the host bundle are modified; this file is
      injected as the last script before </body>, mirroring the bundle's own
      pj-* module convention.
   2. Fail-safe: all init is wrapped; any throw removes the module and leaves
      the host app untouched.
   3. Isolated: renders into its own Shadow DOM — no CSS/id collisions.
   4. No secrets: stores ONLY a control-plane URL. Never place bearer tokens,
      API keys, or signing keys in this file or in browser storage. All infra
      calls (Coolify/Sandboxd/x402) happen server-side behind the control
      plane; the browser is observe-only.
   5. Read-only: this panel displays state and local checklists. It cannot
      deploy, settle, or mutate infrastructure by design (HOTL lives in the
      control plane, not the page).
   CONTROL-PLANE CONTRACT (Phase 2 target, degrades gracefully when absent):
      GET {controlPlane}/api/wire/events   → SSE
        event: stage  data: {"stage":"forge|provision|build|audit|deploy|settle",
                             "state":"idle|live|green|red","detail":"..."}
        event: phase  data: {"phase":0-4,"status":"pending|active|done"}
        event: feed   data: {"msg":"..."}
        event: docs   data: {"ver":"..."}   (module then GETs {controlPlane}/api/wire/docs
          -> {"ver":"...","pages":[{"slug":"wire-*","title":"...","body":"...","tags":[]}]};
          only wire-* slugs accepted, size-capped, forced to system group)
   ========================================================================== */
(function () {
  "use strict";
  if (window.OM_WIRE) return; /* idempotent across re-injection */

  var LS_CFG = "om.wire.cfg", LS_CHK = "om.wire.checks", LS_WIKI = "om.wire.wiki";
  var WIKI_VER = "w6"; /* bump when page bodies change; drives re-sync */
  var WIKI_PAGES = [
    { slug: "wire-adoption", title: "WIRE Adoption", group: "system", sys: "system", tags: ["wire", "adoption", "foundry"],
      body: "# WIRE Adoption\nThe staged process that turns WIRE from a label into shipped infrastructure: [[WIRE P0 \u00b7 Foundations]] \u2192 [[WIRE P1 \u00b7 Dogfood Storefront]] \u2192 [[WIRE P2 \u00b7 Sandboxd Build-Agent]] \u2192 [[WIRE P3 \u00b7 microVM AgentFence]] \u2192 [[WIRE P4 \u00b7 Enterprise WIRE]].\n\nOne pipeline underneath: forge 0.5 \u2192 provision 0.25 \u2192 build \u2192 audit \u2192 deploy \u2192 settle 5.0 outcome \u2014 settled only on external verification. No green, no charge.\n\nRails chosen in [[WIRE Adoption Stack]]. Live status streams into the WIRE panel and this [[Knowledge Galaxy]] from the control plane; [[The Kernel]] stays the in-browser brain, the control plane becomes its hands.\n\n**Rails:** meters on native x402; Tier-2 revenue on the Stripe fiat adapter; one settlement ledger -- no green, no charge on every rail." },
    { slug: "wire-stack", title: "WIRE Adoption Stack", group: "system", sys: "system", tags: ["wire", "stack", "licensing"],
      body: "# WIRE Adoption Stack\nAll MIT / Apache-2.0, all self-hosted:\n\n- **Coolify** (Apache-2.0) \u2014 deploy + control surface; team-scoped API creates apps, servers, deployments programmatically.\n- **Sandboxd** (MIT) \u2014 headless build-agent: one call spins an isolated container, runs a coding agent against a blueprint, streams SSE. Model keys live in its auth proxy, never in the workspace.\n- **microsandbox** (Apache-2.0) \u2014 libkrun microVMs for the hardened [[AgentFence Security]] tier; placeholder secrets substituted only on verified TLS to allowlisted hosts.\n- **LiteLLM + OpenRouter** \u2014 the [[Model Router]] seam; one bill, per-service virtual keys.\n\nHeld: Bolt.diy \u2014 MIT source, but WebContainers requires a commercial license for for-profit production. Sandboxd's headless tasks replaced it.\n- **Stripe** (rail adapter) -- the fiat/enterprise rail: invoicing + Tax, authorize/capture outcome settlement, optional x402 facilitator (preview, US-only). One ledger: Stripe events settle into the x402 graph.\n- **Buzz** (rooms adapter, trial-gated) -- ops-room candidate: Nostr agent identities + signed event log; webhook-chat stays the default until promotion gates pass." },
    { slug: "wire-p0", title: "WIRE P0 \u00b7 Foundations", group: "system", sys: "system", tags: ["wire", "phase"],
      body: "# WIRE P0 \u00b7 Foundations\nOne hardened host running Coolify with TLS. Provider firewall is the real boundary \u2014 Docker rewrites iptables and bypasses UFW. Three scoped tokens minted to the vault: om-root (sealed), foundry-agent (write+deploy), om-observer (read). MCP registered observe-only behind [[AgentFence Security]]. Wildcard DNS for mesh + sbx. Clean-state snapshot + committed provision script = the portability proof.\n\nNext: [[WIRE P1 \u00b7 Dogfood Storefront]] \u00b7 Up: [[WIRE Adoption]]" },
    { slug: "wire-p1", title: "WIRE P1 \u00b7 Dogfood Storefront", group: "system", sys: "system", tags: ["wire", "phase", "x402"],
      body: "# WIRE P1 \u00b7 Dogfood Storefront\nThe paywalled services (research \u00b7 scans \u00b7 quotes \u00b7 solvers) live on the mesh, created entirely through the API so Foundry inherits the scripts. Service ABI: pinned-digest Dockerfile, /healthz, signed /.well-known/om-verify. LiteLLM deploys first, internal-only, one virtual key per service \u2014 [[x402 Payments]] in, model spend out, host cost fixed: the factory meters itself on [[Commerce Rail]].\n\nThe external signed probe \u2014 not \u201cCoolify says healthy\u201d \u2014 is what flips a service live. That same gate becomes the foundry.deploy settlement gate.\n\n**Optional human checkout:** Stripe Checkout for human buyers (bundles at $5+ to clear card fees); agents keep paying via x402; both rails write the same ledger.\n\nNext: [[WIRE P2 \u00b7 Sandboxd Build-Agent]] \u00b7 Up: [[WIRE Adoption]]" },
    { slug: "wire-p2", title: "WIRE P2 \u00b7 Sandboxd Build-Agent", group: "system", sys: "system", tags: ["wire", "phase", "foundry"],
      body: "# WIRE P2 \u00b7 Sandboxd Build-Agent\nBirth of om-ctl \u2014 the control plane behind POST /api/foundry and the WIRE panel's SSE. Ten steps: blueprint \u2192 [[Human-on-the-Loop]] mandate \u2192 sandbox provision \u2192 headless codegen (SSE streamed) \u2192 audit batteries with checkpoint-revert retries \u2192 push \u2192 Coolify deploy \u2192 external verify \u2192 settle 5.0 \u2192 cleanup to zero keys.\n\nSandboxd API stays loopback-only behind an SSH tunnel; model keys sit in its auth proxy, never the workspace. One kill switch tears down sandbox + deploy + keys + pending outcome atomically \u2014 drilled mid-build, on purpose.\n\nDesign the ledger writer as an interface now: at P4 the rails adapter adds Stripe records to the same schema.\n\nNext: [[WIRE P3 \u00b7 microVM AgentFence]] \u00b7 Up: [[WIRE Adoption]]" },
    { slug: "wire-p3", title: "WIRE P3 \u00b7 microVM AgentFence", group: "system", sys: "system", tags: ["wire", "phase", "security"],
      body: "# WIRE P3 \u00b7 microVM AgentFence\nAnything the operator didn't write runs behind hardware virtualization \u2014 /dev/kvm on bare metal, golden-image snapshot forks for reproducible provenance. The trust router defaults unknown \u2192 microVM: isolation is the floor, not a feature.\n\nSecrets can't leak by construction: the guest holds placeholders, real keys substitute only on verified TLS to allowlisted hosts \u2014 and no git credentials exist in the guest at all; om-ctl extracts and pushes externally. A five-drill red-team battery (exfil, env harvest, metadata grab, resource abuse, host reach) must fail closed with evidence in the audit pack. This is [[AgentFence Security]] made physical.\n\nThe battery is now seven drills: the original five plus **memory poisoning** (a phase-1 poison in one session must never authorize a deploy or payment in a later one) and **metadata injection** (payloads smuggled through MCP tool descriptions, agent-card fields, and resource identifiers -- trusted-looking channels that instruction-injection defenses miss). Package registries and caching proxies are in-scope attack surface, not infrastructure. See [[Pins, Advisories & Drills]].\n\nNext: [[WIRE P4 \u00b7 Enterprise WIRE]] \u00b7 Up: [[WIRE Adoption]]" },
    { slug: "wire-p4", title: "WIRE P4 \u00b7 Enterprise WIRE", group: "system", sys: "system", tags: ["wire", "phase", "governance"],
      body: "# WIRE P4 \u00b7 Enterprise WIRE\ntenant.forge: Terraform \u2192 per-tenant server \u2192 Coolify registration \u2192 is_usable \u2192 sibling MAOS deployed \u2014 zero manual steps. Hardware is the security boundary; projects are the admin boundary. The 2.5% settlement share is computed from the [[x402 Payments]] ledger and published tenant-reproducible \u2014 never self-reported.\n\nSigned audit packs (hybrid signatures per [[PQC Migration OS]]) become tier deliverables. om-policy holds the trust router, egress allowlists, [[Human-on-the-Loop]] thresholds and settlement gates \u2014 council-readable, mandate-merged. Kill switches (tenant + global) are stopwatch-timed drills. Scale gate at ~10 tenants: Coolify v5 vs k8s.\n\n**Fiat revenue floor:** Tier-2 invoices ride Stripe (ACH/card + Tax); signature-verified invoice.paid webhooks write ledger settlements; card-sized outcomes authorize at deploy and capture only on external verify -- no green, no charge holds on fiat too.\n\nUp: [[WIRE Adoption]] \u00b7 Stack: [[WIRE Adoption Stack]]" },
    { slug: "wire-readme", title: "OM README", group: "system", sys: "system", tags: ["wire", "readme", "docs"],
      body: "# OM README\nOpenMesha: a unified agentic operating system \u2014 mission control, voice copilot, [[LLM Council]], and a metered agent economy \u2014 running on self-hosted MIT/Apache-2.0 rails. The browser app is the brain; om-ctl is the hands; the rails in [[WIRE Adoption Stack]] are the muscles.\n\n**Architecture.** Browser ([[The Kernel]] + WIRE panel) \u2194 om-ctl (sole keyholder: pipeline \u00b7 [[Human-on-the-Loop]] \u00b7 kill \u00b7 settlement) \u2192 om-mesh-1 (Coolify + LiteLLM [[Model Router]] seam + storefront), om-sbx-1 (trusted builds), om-mvx-1 (untrusted code in microVMs), and one server per enterprise tenant.\n\n**Deploy** is the phased path in [[WIRE Adoption]] \u2014 each phase's exit checklist is its go-live certificate: [[WIRE P0 \u00b7 Foundations]] \u2192 [[WIRE P1 \u00b7 Dogfood Storefront]] \u2192 [[WIRE P2 \u00b7 Sandboxd Build-Agent]] (badge flips LIVE) \u2192 [[WIRE P3 \u00b7 microVM AgentFence]] \u2192 [[WIRE P4 \u00b7 Enterprise WIRE]].\n\n**Operate.** The verify gate is law: only an external signed probe of /.well-known/om-verify flips a service live or settles a foundry.deploy outcome on [[x402 Payments]] \u2014 no green, no charge. Every deploy-capable action pauses on a mandate. Kill switches are stopwatch-timed drills. One triple feed joins x402 revenue, model spend, and host cost: the factory meters itself on [[Commerce Rail]]. Signed audit packs per deployment and per tenant, retained off-provider.\n\n**Automate.** om-ctl streams every pipeline transition as SSE the WIRE panel renders; the browser holds zero credentials. Trust router: operator \u2192 sandbox tier; external, generated, or unknown \u2192 microVM \u2014 isolation is the floor of [[AgentFence Security]]. Agents drive the rails via MCP with least-ability tokens and follow the [[AGENTS Contract]].\n\n**Security in five boundaries:** hardware isolates code; projects scope admin; the provider firewall owns the network (Docker bypasses UFW); the vault + placeholder substitution own secrets (the untrusted tier holds no git credentials at all); mandates own authority.\n\n**Portability:** everything replays from committed infra on any Docker-capable host; backups live on a different provider; walking away is hours, not months.\n\n**Payment rails:** meters settle on native x402 only; Tier-2 enterprise revenue rides Stripe invoicing (+Tax); card-sized outcomes authorize at deploy and capture only on external verify. Every rail writes the one settlement ledger." },
    { slug: "wire-agents", title: "AGENTS Contract", group: "system", sys: "system", tags: ["wire", "agents", "docs"],
      body: "# AGENTS Contract\nThe operational contract for agents working the mesh. Full version ships as AGENTS.md in the repo root; this node is the always-loaded core. Humans: read [[OM README]].\n\n**Golden rules \u2014 violating any is an incident:**\n- Never hold om-root; it is vault-sealed.\n- Never place credentials in the browser, a workspace, a guest, a repo, or logs. The untrusted tier gets no git credentials ever \u2014 om-ctl extracts and pushes.\n- Never deploy without a fresh [[Human-on-the-Loop]] approval id.\n- Never settle a foundry.deploy outcome on platform status alone \u2014 the external signed probe is the only settlement evidence ([[x402 Payments]]). Void on any failure.\n- Never route external, generated, or unknown trust to the container tier; unknown \u2192 microVM ([[AgentFence Security]]).\n- Never widen firewalls or egress allowlists yourself \u2014 propose to om-policy; only mandates merge.\n- Always use the least token (om-observer by default; foundry-agent only inside pipeline SOPs) and always install from pinned mirrors, never upstream main.\n\n**Surfaces.** Coolify /api/v1: create app (public \u00b7 private-github-app \u00b7 private-deploy-key \u00b7 dockerfile \u00b7 dockerimage) \u2192 envs bulk BEFORE first deploy \u2192 deploy?uuid \u2192 poll deployments \u2014 honor 429 Retry-After. Servers: security/keys \u2192 servers with instant_validate \u2192 poll is_reachable + is_usable. Sandboxd (tunnel-only, 127.0.0.1:9090): POST /sandbox \u2192 tasks with prompt+agent \u2192 exec \u2192 files; model keys live in its auth proxy; every task is checkpointed. microsandbox: fork from the forge-ready snapshot; placeholder secrets bound to allowlisted hosts; restricted network. om-ctl: /api/foundry \u00b7 /api/wire/events \u00b7 /api/hotl \u00b7 /api/kill.\n\n**SOPs:** 1 deploy service \u00b7 2 forge trusted ([[WIRE P2 \u00b7 Sandboxd Build-Agent]]) \u00b7 3 forge untrusted (placeholders; push from outside \u2014 [[WIRE P3 \u00b7 microVM AgentFence]]) \u00b7 4 verify+settle \u00b7 5 kill (build/tenant/global \u2014 if a human is asking whether to kill, kill first) \u00b7 6 tenant.forge ([[WIRE P4 \u00b7 Enterprise WIRE]]) \u00b7 7 galaxy sync (use OM_WIRE.embedWiki; never dispatch PJ_WIKI_MERGE \u2014 it strips all pj-* pages).\n\n**Cadence:** per-deploy verify+audit append \u00b7 daily egress + spend checks \u00b7 weekly pin review \u00b7 monthly kill + restore drills and tenant packs \u00b7 quarterly red-team battery, all failing closed.\n\n**Gotchas:** UFW is decorative under Docker \u00b7 auto-deploy may not register on API-created apps (push-test, toggle once) \u00b7 bulk-env shape varies \u00b7 one-app-many-servers is UI-only \u00b7 cloud VMs lack /dev/kvm \u00b7 previews require the GitHub App source.\n\n**Rails:** Stripe secret keys are vault-only in om-ctl; never trust a webhook without signature verification; every Stripe money movement is mandate-gated; Stripe events write into the one x402 settlement ledger (a second ledger is an incident); meters never ride cards; Stripe-as-x402-facilitator is preview/US-only -- redundancy, never the default." },
    { slug: "wire-rooms", title: "Rooms & the Ops Surface", group: "system", sys: "system", tags: ["wire", "rooms", "buzz"],
      body: "# Rooms & the Ops Surface\nThe ops room is an adapter seam in om-ctl (rooms/), mirroring the rails pattern: **webhook-chat** is the default backend; **Buzz** (Block, Apache-2.0, Nostr) is the trial-gated candidate. Rooms display the feed and carry triggers -- they never hold authority, credentials, or settlement. Mandates stay hybrid-signed in om-ctl per [[Human-on-the-Loop]]; a kill phrase in a room is a trigger om-ctl validates, never the mechanism.\n\nWhy Buzz earns the trial: agents as identity-bearing peers -- own keypairs, signed audit trail -- the property [[WIRE P4 \u00b7 Enterprise WIRE]] audit packs can sell, plus an ACP harness for the same Claude Code the build sandboxes already run ([[WIRE P2 \u00b7 Sandboxd Build-Agent]]).\n\nPromotion gates: upstream rate limiting enforced (today a test stub); the relay survives two pin bumps from our mirror; the git forge stays held regardless. The room is never on a critical path: P2 ships on webhook-chat no matter what. Peers weighed: Centaur (duplicates om-ctl + sandbox; mine iron-proxy for [[AgentFence Security]]) and Zulip/Mattermost/Matrix (mature, boring interim backends). See [[AGENTS Contract]] SOP-10 and [[WIRE Adoption Stack]]." },
    { slug: "wire-pins", title: "Pins, Advisories & Drills", group: "system", sys: "system", tags: ["wire", "pins", "security"],
      body: "# Pins, Advisories & Drills\nLiving operational state. The canonical register is the pin table in [[AGENTS Contract]]; this node is the always-loaded summary. Bump only via the weekly review, never mid-incident.\n\n**Pins.** LiteLLM v1.93.0 -- plain SemVer now, the -stable suffix scheme is retired; clears a KEV-listed RCE chain, requires Starlette 1.0.1+, stays internal-only with PROXY_ADMIN-gated MCP test endpoints. microsandbox v0.6.7 on libkrunfw 5.6.0 -- two breaking changes (structured root-disk spec, guest paths typed as strings), so rebuild the golden image and regression-pass the placeholder-secret path. Coolify holds at v4.1.2; v4.2.0 requires POST for state-changing endpoints and makes Member read-only, which breaks om-ctl until adapted -- stage it, don't ship it. Sandboxd holds its current pin. MCP targets spec 2026-07-28: stateless core, header routing, OAuth 2.1 + RFC 9728 on every remote surface, 12-month runway.\n\n**Doctrine this week.** Treat imported skills, MCP tool descriptions, and A2A agent cards as untrusted input -- pin, verify provenance, static-scan before any of it reaches an agent ([[WIRE P2 \u00b7 Sandboxd Build-Agent]]). Treat package registries and caching proxies as in-scope attack surface: a July 2026 frontier-lab sandbox escape ran straight through the package proxy inside a supposedly no-internet environment. An allowlist entry is not a trust grant.\n\n**Drills (seven).** exfil \u00b7 env harvest \u00b7 metadata grab \u00b7 resource abuse \u00b7 host reach \u00b7 memory poisoning (cross-session) \u00b7 metadata injection. All must fail closed with evidence in the audit pack -- see [[WIRE P3 \u00b7 microVM AgentFence]].\n\n**Watch.** Coolify v5 timeline \u00b7 Buzz rate-limit enforcement ([[Rooms & the Ops Surface]]) \u00b7 x402 sub-dollar value mix, which the Stripe fiat adapter already hedges ([[x402 Payments]])." }
  ];
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var PHASES = [
    { n: 0, t: "Foundations", items: [
      "CX32 provisioned via infra/provision.sh (portable, replayable)",
      "Provider firewall = boundary (Docker bypasses UFW); 80/443 world, 22 admin-IP",
      "Coolify TLS at mesh.<domain>; setup ports 8000/6001/6002 deleted",
      "Wildcard DNS: *.mesh (live) + *.sbx (reserved for Sandboxd)",
      "Tokens in vault: om-root (sealed), foundry-agent (write+deploy), om-observer (read)",
      "MCP enabled, registered observe-only behind AgentFence",
      "Notifications → ops feed; phase0-clean snapshot + backups on" ] },
    { n: 1, t: "Dogfood Storefront", items: [
      "Service ABI: Dockerfile (pinned digests), /healthz, signed /.well-known/om-verify",
      "GitHub App source installed (previews require it; deploy keys don't support them)",
      "LiteLLM internal-only seam; per-service virtual keys for spend attribution",
      "create-app.sh ×4 via /applications/private-github-app (Foundry inherits it)",
      "Bulk envs landed before first deploy (instant_deploy:false)",
      "Auto-deploy webhook verified on API-created apps (coolify#4557 gotcha)",
      "PR previews = staging on {{pr_id}}.<svc>.mesh.<domain>",
      "verify.sh: external signed probe flips live — Coolify-healthy is not verified",
      "Rollback drill < 5 min; deliberate failure correctly refused",
      "Triple feed live: x402 in ↔ LiteLLM spend ↔ host cost" ] },
    { n: 2, t: "Sandboxd Build-Agent", items: [
      "Separate VM on *.sbx (blast-radius split from Coolify host)",
      "Bearer auth ON (off by default!), TLS, API firewalled to control plane",
      "Host egress default-deny; allowlist: git, registries, LiteLLM only",
      "Pipeline: forge 0.5 → POST /sandbox 0.25 → /tasks SSE → exec audits green",
      "Green → git push (per-build deploy key) → Coolify create+deploy",
      "External probe verifies → settle foundry.deploy 5.0 (no green, no charge)",
      "HOTL mandate gate before deploy call (Milestone-6 pattern)",
      "Kill switch drilled mid-build: destroy sbx + cancel deploy + revoke key + void outcome",
      "Repo mirrored + version pinned (fork-and-own hedge)" ] },
    { n: 3, t: "microVM AgentFence", items: [
      "/dev/kvm confirmed — bare metal / dedicated (cloud VMs rarely expose nested virt)",
      "microsandbox trial (libkrun, Apache-2.0, MCP-native); E2B fallback triggers defined",
      "Routing: trust=operator → Sandboxd; trust=external|generated → microVM",
      "Secret-substitution pattern adopted (real keys never enter the VM)",
      "Per-build egress allowlists + outbound logs → audit.export packs" ] },
    { n: 4, t: "Enterprise WIRE", items: [
      "Server-per-tenant: Foundry provisions VM → registers Coolify server → deploys sibling",
      "Tenant kill switch (tokens+stop) and global kill switch (mcp/disable+rotate) drilled",
      "Audit packs: Coolify audit log + egress log + x402 ledger per deployment",
      "Scale gate at ~10 tenant servers: checkpoint Coolify v5 vs k8s+Argo",
      "Policy-as-code: routing, egress, HOTL thresholds, settlement gates — mandate-gated" ] }
  ];
  var STAGES = [
    ["forge", "0.5"], ["provision", "0.25"], ["build", ""],
    ["audit", ""], ["deploy", ""], ["settle", "5.0"]
  ];

  var W = {
    version: "0.6.0",
    cfg: lsGet(LS_CFG, { controlPlane: "" }),
    checks: lsGet(LS_CHK, {}),
    es: null, retry: 0, open: false, ui: {},
    stages: {}, phaseStatus: {}, feed: []
  };

  function pushFeed(msg) {
    W.feed.push({ t: Date.now(), msg: String(msg).slice(0, 160) });
    if (W.feed.length > 40) W.feed.shift();
    render();
  }

  /* ---- host-app integration: passive listener on the bundle's own bus ---- */
  window.addEventListener("om-action", function (e) {
    try {
      var d = e && e.detail || {};
      if (d.type) pushFeed("app · " + d.type + (d.kind ? " · " + d.kind : ""));
      /* convergence: if the Palimpsest module merges after our hydrate, re-compose
         once from the now-persisted state (coalesced; wire-* dedupe makes it safe) */
      if (d.type === "PJ_WIKI_MERGE" && lsGet(LS_WIKI, null) && !W.reQueued) {
        W.reQueued = true;
        setTimeout(function () { W.reQueued = false; embedWiki(false); }, 1200);
      }
    } catch (err) {}
  }, { passive: true });

  /* ------------------- Knowledge Galaxy embedding ------------------------- */
  /* Mechanism: the app persists near-live state to localStorage["om.state"] on
     every reducer tick, and its reducer exposes a generic HYDRATE case. We read
     the persisted wikiPages, drop any previous wire-* nodes, append ours, and
     hydrate exactly {wikiPages} back — the app's own vocabulary, nothing else
     touched, pj-* Palimpsest pages preserved, idempotent by construction. */
  function appState() {
    try { var v = localStorage.getItem("om.state"); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function embedWiki(manual, force) {
    try {
      var st = appState();
      if (!st || !st.wikiPages || !st.wikiPages.length) {
        if (manual) pushFeed("wiki · app state not ready yet — retry in a moment");
        return false;
      }
      var cur = null;
      st.wikiPages.forEach(function (p) { if (p && p.slug === "wire-adoption") cur = p; });
      if (cur && cur.wv === WIKI_VER && !manual && !force) return true; /* embedded + current */
      if (!window.__OM_DISPATCH) { if (manual) pushFeed("wiki · dispatch bus not ready"); return false; }
      var composed = st.wikiPages
        .filter(function (p) { return !(p && p.slug && p.slug.indexOf("wire-") === 0); })
        .concat(effectivePages().map(function (p) {
          var q = {}; for (var k in p) q[k] = p[k]; q.wv = WIKI_VER; return q;
        }));
      window.__OM_DISPATCH({ type: "HYDRATE", snapshot: { wikiPages: composed } });
      lsSet(LS_WIKI, { v: WIKI_VER, t: Date.now(), docsVer: W.docsVer || (lsGet(LS_WIKI, null) || {}).docsVer || null });
      if (W.ui.wikBtn) W.ui.wikBtn.textContent = "Knowledge Galaxy \u00b7 synced \u2713 (tap to re-sync)";
      pushFeed("wiki · adoption embedded \u2192 Knowledge Galaxy (" + effectivePages().length + " nodes)");
      return true;
    } catch (e) { if (manual) pushFeed("wiki · embed failed: " + (e && e.message)); return false; }
  }
  function autoEmbed(tries) {
    if (!lsGet(LS_WIKI, null)) return;            /* only after explicit first opt-in */
    if (embedWiki(false) || tries <= 0) return;
    setTimeout(function () { autoEmbed(tries - 1); }, 900);
  }
  /* ---- live docs refresh (auto-update once a control plane exists) -------- */
  function sanitizePages(list) {
    var out = []; if (!list || !list.length) return out;
    for (var i = 0; i < list.length && out.length < 24; i++) {
      var p = list[i];
      if (!p || typeof p.slug !== "string" || p.slug.indexOf("wire-") !== 0) continue;
      if (typeof p.title !== "string" || typeof p.body !== "string") continue;
      out.push({ slug: p.slug.slice(0, 60), title: p.title.slice(0, 80), group: "system",
        sys: "system", tags: (p.tags && p.tags.slice ? p.tags.slice(0, 6) : ["wire"]),
        body: p.body.slice(0, 20000) });
    }
    return out;
  }
  function effectivePages() {
    if (!W.docsPages || !W.docsPages.length) return WIKI_PAGES;
    var over = {}; W.docsPages.forEach(function (p) { over[p.slug] = p; });
    var seen = {}, out = [];
    WIKI_PAGES.forEach(function (p) { out.push(over[p.slug] || p); seen[p.slug] = 1; });
    W.docsPages.forEach(function (p) { if (!seen[p.slug]) out.push(p); });
    return out;
  }
  function refreshDocs(manual) {
    var cp = (W.cfg.controlPlane || "").replace(/\/+$/, "");
    if (!cp) { if (manual) pushFeed("wiki · set the control plane URL first"); return; }
    fetch(cp + "/api/wire/docs").then(function (r) { return r.json(); }).then(function (j) {
      var pages = sanitizePages(j && j.pages);
      if (!pages.length) { if (manual) pushFeed("wiki · no docs at control plane"); return; }
      var ver = (j && j.ver) ? String(j.ver).slice(0, 40) : "n" + pages.length;
      var mark = lsGet(LS_WIKI, null) || {};
      if (!manual && mark.docsVer === ver && W.docsVer === ver) return;
      W.docsPages = pages; W.docsVer = ver;
      if (lsGet(LS_WIKI, null)) embedWiki(false, true);
      pushFeed("wiki · docs " + ver + " pulled from control plane (" + pages.length + " pages)");
    }).catch(function () { if (manual) pushFeed("wiki · docs fetch failed (CORS or offline)"); });
  }

  /* ---------------------------- SSE (observe-only) ------------------------ */
  function disconnect() { try { if (W.es) W.es.close(); } catch (e) {} W.es = null; setBadge("offline"); }
  function connect() {
    disconnect();
    var cp = (W.cfg.controlPlane || "").replace(/\/+$/, "");
    if (!cp) { setBadge("offline"); return; }
    setBadge("connecting");
    try {
      var es = new EventSource(cp + "/api/wire/events");
      W.es = es;
      es.onopen = function () { W.retry = 0; setBadge("live"); pushFeed("wire · control plane connected"); refreshDocs(false); };
      es.addEventListener("stage", function (ev) {
        try { var d = JSON.parse(ev.data); W.stages[d.stage] = d; render(); } catch (e) {}
      });
      es.addEventListener("phase", function (ev) {
        try { var d = JSON.parse(ev.data); W.phaseStatus[d.phase] = d.status; render(); } catch (e) {}
      });
      es.addEventListener("feed", function (ev) {
        try { pushFeed("cp · " + (JSON.parse(ev.data).msg || "")); } catch (e) {}

ectedNamespaces\": [\n  \"om-arch.w\",\n  \"security.floor\",\n  \"rsi.holdoutEpsilon\",\n  \"verifier.entailmentThreshold\",\n  \"verifier.canaryAlpha\",\n  \"rki.minExternalRatio\",\n  \"hotl.\"\n ],\n \"invariants\": [\n  \"I1 wiki bodies are append-only\",\n  \"I2 every landed parameter respects its declared bounds\",\n  \"I3 protected namespaces are never writable by the autonomous loop\",\n  \"I4 Tier C (money-moving / irreversible) never auto-lands\",\n  \"I5 the objective's own weights are protected — the loop may not reweight its own scorecard\"\n ]\n}\n---\n# System Architecture\n\nOpenMesha's recursive self-improvement rests on one structural claim: **autonomy is not the removal of gates, it is the mechanization of them.** Every change that lands does so because a verifier could check it, not because a human was too busy to object.\n\nThe loop reads its self-model from the [[Knowledge Galaxy]], proposes changes through the [[Self-Improvement Loop]], and lands them only through the [[Verifier Stack]]. Evidence enters through [[Recursive Knowledge Improvement]] after passing [[AgentFence Security]]. Behaviour under optimization lives in [[Model Router]], [[Temporal Memory Graph]], [[AgentFence Security]] and [[Commerce Rail]]; results are reported on [[Learning Curves]]. What cannot be machine-checked stays at [[Human-on-the-Loop]].\n\n## The objective weights are protected\n\n`wRouter`, `wMemory`, `wSecurity` and `wCommerce` compose J, the scalar the loop maximizes. They are listed in `protectedNamespaces` and the loop cannot touch them. This is the single most important protection in the system: a self-improver that can edit its own scorecard does not improve, it flatters itself.","rki.md":"---json\n{\n \"slug\": \"rki\",\n \"title\": \"Recursive Knowledge Improvement\",\n \"sys\": \"improve\",\n \"group\": \"learning\",\n \"params\": {\n  \"selfDecay\": 0.6,\n  \"topKSources\": 5,\n  \"minExternalRatio\": 0.4\n },\n \"bounds\": {\n  \"selfDecay\": [\n   0.3,\n   0.95\n  ],\n  \"topKSources\": [\n   3,\n   10\n  ],\n  \"minExternalRatio\": [\n   0,\n   1\n  ]\n },\n \"behavioral\": [],\n \"ints\": [\n  \"topKSources\"\n ],\n \"evals\": [],\n \"invariants\": [\n  \"sources are append-only and content-hashed\",\n  \"quarantined sources are never citable\",\n  \"self-authored sources decay in retrieval weight by generation\"\n ]\n}\n---\n# Recursive Knowledge Improvement\n\nRaw inputs — external notes, tool output, cycle telemetry — are ingested as **append-only, content-hashed sources**. Nothing is overwritten; corrections supersede. Every ingest passes L1 scan from [[AgentFence Security]] first: flagged text is stored quarantined and can never be cited, which is the answer to memory poisoning once the corpus starts driving behaviour.\n\n## Why self-authored knowledge decays\n\nA loop that writes its own reference material and then cites it converges on its own priors — the corpus stops carrying information about the world and starts carrying information about the model. Two defenses: `selfDecay` down-weights self-origin sources by generation at retrieval time, and `minExternalRatio` (protected) is a floor on the share of citable sources that came from outside. Below the floor, self-cited prose diffs are refused outright.\n\nSynthesis produces propose-only diffs into the [[Knowledge Galaxy]] and observations for the [[Temporal Memory Graph]].","router.md":"---json\n{\n \"slug\": \"router\",\n \"title\": \"Model Router\",\n \"sys\": \"route\",\n \"group\": \"intelligence\",\n \"params\": {\n  \"costWeight\": 0.55,\n  \"latencyWeight\": 0.35,\n  \"explorationBonus\": 0.25\n },\n \"bounds\": {\n  \"costWeight\": [\n   0,\n   2\n  ],\n  \"latencyWeight\": [\n   0,\n   2\n  ],\n  \"explorationBonus\": [\n   0,\n   1\n  ]\n },\n \"behavioral\": [\n  \"costWeight\",\n  \"latencyWeight\",\n  \"explorationBonus\"\n ],\n \"evals\": [\n  \"router\"\n ],\n \"invariants\": [\n  \"routing must never be scored on cost alone\"\n ]\n}\n---\n# Model Router\n\nPer-task arm selection across four models with different quality, price and latency profiles. The router does not observe a task's true cost-sensitivity or urgency; it sees noisy estimates, so the optimal weights are shrunk below one — a fact the search has to discover rather than assume.\n\nScore for arm *a* on task *t*: `q̂(a,kind) + explorationBonus·(Beta draw − posterior mean) − costWeight·ĉ(t)·cost(a) − latencyWeight·û(t)·lat(a)`. Realized utility is measured against the oracle choice for that task, normalized per task so the suite score is a fraction of achievable utility.\n\nAll three params are behavioral: they change the distribution of choices, not a scalar output, so they clear a canary at the [[Verifier Stack]]. Retuned by the [[Self-Improvement Loop]] using context recalled from the [[Temporal Memory Graph]]; reported on [[Learning Curves]]. See [[System Architecture]].","rsi.md":"---json\n{\n \"slug\": \"rsi\",\n \"title\": \"Self-Improvement Loop\",\n \"sys\": \"improve\",\n \"group\": \"learning\",\n \"params\": {\n  \"sigma0\": 0.12,\n  \"expandRate\": 1.12,\n  \"shrinkRate\": 0.85,\n  \"successTarget\": 0.2,\n  \"dims\": 2,\n  \"batch\": 3,\n  \"holdoutEpsilon\": 0.004\n },\n \"bounds\": {\n  \"sigma0\": [\n   0.02,\n   0.3\n  ],\n  \"expandRate\": [\n   1.02,\n   1.35\n  ],\n  \"shrinkRate\": [\n   0.7,\n   0.98\n  ],\n  \"successTarget\": [\n   0.1,\n   0.4\n  ],\n  \"dims\": [\n   1,\n   4\n  ],\n  \"holdoutEpsilon\": [\n   0,\n   0.05\n  ]\n },\n \"behavioral\": [],\n \"meta\": [\n  \"sigma0\",\n  \"expandRate\",\n  \"shrinkRate\",\n  \"successTarget\",\n  \"dims\"\n ],\n \"ints\": [\n  \"dims\"\n ],\n \"evals\": [],\n \"invariants\": [\n  \"best-so-far J ratchets monotonically\",\n  \"meta-parameter changes require a meta-canary, not a single trial\"\n ]\n}\n---\n# Self-Improvement Loop\n\nA (1+1) evolution strategy over θ, the governed parameters collected from the [[Knowledge Galaxy]]. Each cycle spends a budget of `batch` candidate evaluations and lands at most one — `batch` carries no bounds, so it is an operating constant a human sets rather than a coordinate the search may move. Each cycle perturbs `dims` randomly chosen coordinates of the incumbent with N(0,σ) in normalized bounds-space, evaluates on the training split, and keeps strictly-better candidates. σ adapts by the one-fifth success rule: multiply by `expandRate` when recent acceptance exceeds `successTarget`, by `shrinkRate` otherwise.\n\n## The improver improves itself\n\n`sigma0`, `expandRate`, `shrinkRate`, `successTarget` and `dims` are themselves in θ — the loop can retune its own search. That creates a verification problem: a meta-parameter has no immediate effect on J, so the ordinary \"did this trial score better\" test is meaningless for it. The [[Verifier Stack]] answers with a **meta-canary**: replay short search runs from the current incumbent under both the old and new settings across several seeds, and land only if a bootstrap confidence interval on the difference in final best-J excludes zero.\n\n`holdoutEpsilon` is protected. It is the maximum holdout regression the verifier will tolerate, and a loop that can widen its own tolerance has no tolerance at all.\n\nResults feed [[Learning Curves]] and retune [[Model Router]].","security.md":"---json\n{\n \"slug\": \"security\",\n \"title\": \"AgentFence Security\",\n \"sys\": \"sec\",\n \"group\": \"security\",\n \"params\": {\n  \"blockAt\": 1,\n  \"floor\": 0.25,\n  \"huntMutations\": 24\n },\n \"bounds\": {\n  \"blockAt\": [\n   1,\n   3\n  ],\n  \"floor\": [\n   0,\n   1\n  ],\n  \"huntMutations\": [\n   8,\n   64\n  ]\n },\n \"behavioral\": [\n  \"blockAt\"\n ],\n \"ints\": [\n  \"blockAt\",\n  \"huntMutations\"\n ],\n \"evals\": [\n  \"security\"\n ],\n \"invariants\": [\n  \"security suite fitness may never fall below security.floor\",\n  \"signatures change only on red-team evidence, never by direct write\"\n ]\n}\n---\n# AgentFence Security\n\nTwo layers. **L1 scan-on-ingest** screens every inbound source before it can enter context or be cited; flagged content is wrapped as data, never as instructions. **L2 act-gate** governs what may be done next, escalating anything irreversible to [[Human-on-the-Loop]]. Matching is done on the raw text, a normalized form, and a whitespace-squeezed form, so hyphen-splitting and spacing tricks do not walk through.\n\nFitness is catch-rate × (1 − false-positive rate) over a corpus that keeps changing, because the red team is a bandit over mutation operators that is rewarded for finding bypasses. When it finds one, the resulting signature is a *proposal* — it clears the [[Verifier Stack]] like anything else, and is refused if it flags any benign traffic.\n\n`floor` is protected. It is the hard minimum on security fitness, checked after every candidate change anywhere in the system: a router tweak that somehow degrades safety is rejected on those grounds alone. Gates the [[Commerce Rail]]; evidence flows to [[Recursive Knowledge Improvement]].","verifier.md":"---json\n{\n \"slug\": \"verifier\",\n \"title\": \"Verifier Stack\",\n \"sys\": \"sec\",\n \"group\": \"governance\",\n \"params\": {\n  \"entailmentThreshold\": 0.62,\n  \"canaryAlpha\": 0.05,\n  \"canaryFrac\": 1\n },\n \"bounds\": {\n  \"entailmentThreshold\": [\n   0,\n   1\n  ],\n  \"canaryAlpha\": [\n   0,\n   1\n  ],\n  \"canaryFrac\": [\n   0.2,\n   1\n  ]\n },\n \"behavioral\": [],\n \"evals\": [],\n \"invariants\": [\n  \"protected params are rejected, never queued\",\n  \"Tier C is queued for a human token, never auto-landed\",\n  \"every landing is signed and journalled before it is applied\"\n ]\n}\n---\n# Verifier Stack\n\nThree tiers, assigned by what can be checked rather than by how the change feels.\n\n**Tier A — auto-land.** Non-behavioral params and prose. Checks: bounds, protection, safety floor, training improvement, holdout non-regression within `holdoutEpsilon`, and per-suite non-regression across the blast radius computed from the [[Knowledge Galaxy]] link graph. Prose additionally needs lexical entailment against its cited sources above `entailmentThreshold`, every numeral present in a cited source, and no contradiction with live frontmatter.\n\n**Tier B — canary.** Behavioral params, whose effect is distributional. Note the coupling: a canary slice too small to resolve the effect size refuses *every* behavioural change, so measurement volume, not policy, is what sets how much of the system can move autonomously. Paired per-task deltas on a held-aside canary slice, accepted only when a seeded bootstrap CI at `canaryAlpha` excludes zero — then re-confirmed on the full training split. Failure auto-reverts from the archive.\n\n**Tier C — human token.** Money-moving or externally irreversible actions. Not gated for ceremony: there is no fast objective verifier for \"was that deal good\", so the loop queues them at [[Human-on-the-Loop]] and moves on. Absence of a verifier is the criterion, and the honest answer when one does not exist is to stop.\n\nEvery change is applied first to a sandbox copy of the galaxy and evaluated there; only a passing sandbox is committed. See [[Self-Improvement Loop]] and [[AgentFence Security]]."},"notes":{"bandit-shrinkage.md":"# Bandits, Beta posteriors and shrinkage under noisy signals\nThompson sampling maintains a Beta posterior over each arm's success probability and selects the arm with the highest sampled draw, which trades exploration against exploitation without an explicit schedule. An exploration bonus scales how far a sampled draw is allowed to pull the decision away from the posterior mean; too small a bonus locks the policy onto whichever arm happened to look good first, and too large a bonus wastes decisions on arms already known to be weak.\nWhen a decision rule weights a feature that is observed with noise, the optimal weight shrinks below the value it would take if the feature were observed exactly. This shrinkage result means a router that reads noisy cost sensitivity and urgency signals should discount them rather than trust them fully. The amount of shrinkage grows with the variance of the observation noise.\n","bootstrap.md":"# Bootstrap confidence intervals for paired differences\nThe percentile bootstrap estimates the sampling distribution of a statistic by resampling the observed data with replacement many times and reading percentiles off the resulting distribution. For paired measurements the differences are resampled directly, which controls for per-item variation and gives a confidence interval on the mean difference.\nA change is accepted as an improvement only when the lower bound of the interval excludes zero at the chosen alpha level. Seeding the resampler makes the test deterministic, so a verifier and an auditor examining the same data reach the same verdict.\nPaired testing on a slice reserved for that purpose avoids spending the holdout on repeated significance tests.\n","demand-curve.md":"# Exponential demand and single peaked revenue\nA common model of metered demand has quantity falling exponentially in price with a segment specific scale parameter lambda. Revenue is price multiplied by quantity, which under exponential demand is single peaked: it rises while the price increase outweighs the volume lost, and falls once volume loss dominates.\nThe revenue maximizing price under this model equals lambda, and the achievable maximum equals lambda times baseline demand divided by e. Reporting realized revenue as a fraction of that achievable maximum makes pricing performance comparable across segments with different scales. When a population mixes several segments the optimal single price is an interior compromise between the smallest and the largest lambda.\n","entailment.md":"# Grounding generated claims in cited sources\nA generated claim is grounded when the cited source entails it. A cheap and conservative approximation checks lexical coverage: the content words of the claim should appear in the cited text above a threshold, and every numeral in the claim must be present in a cited source, since numbers are the most common site of fabrication.\nLexical coverage is a stand in for natural language inference and will accept some paraphrases it should not; it is chosen because it is deterministic, auditable, and cheap enough to run on every proposed edit. A claim that contradicts a value recorded elsewhere in the same system should be rejected outright rather than merged, because a knowledge base that holds both a value and its negation cannot be used to make decisions.\n","es-one-fifth.md":"# The one-fifth success rule in evolution strategies\nA (1+1) evolution strategy maintains a single incumbent solution and generates one candidate per step by adding a Gaussian perturbation with standard deviation sigma. The candidate replaces the incumbent only when it is strictly better, so the best-so-far value ratchets monotonically and never regresses.\nRechenberg's one-fifth success rule adapts the step size from the observed acceptance rate: when more than about one fifth of recent trials succeed the search is in an easy region and sigma should expand to explore; when fewer succeed sigma should shrink to exploit. A success target near 0.20 balances exploration against exploitation. Expansion factors are typically small, near 1.1, and shrink factors near 0.85, because aggressive adaptation makes the step size oscillate instead of converging.\nPerturbing a subset of coordinates per step, rather than all of them, raises the acceptance rate in high dimensional parameter spaces.\n","goodhart.md":"# Goodhart's law and holdout validation\nWhen a measure becomes a target it ceases to be a good measure. An optimizer that is scored on the same data it tunes against will eventually improve the score without improving the underlying capability, a failure known as overfitting or Goodharting the metric.\nThe standard defense is a holdout split that the optimizer never observes. Improvement on the training split accompanied by regression on the holdout split is the signature of Goodharting, and the divergence between the two curves is the quantity to monitor. A tolerance epsilon defines how much holdout regression is treated as noise rather than as evidence of overfitting; the tolerance must be fixed in advance and must not be writable by the process being audited.\nA third disjoint slice, used only for significance testing of candidate changes, keeps the holdout uncontaminated by repeated peeking.\n","hash-chain.md":"# Hash chained logs and signed decisions\nAn append only log becomes tamper evident when each entry stores the hash of the previous entry together with a hash over its own content. Recomputing the chain detects any modification or deletion of history, because every later hash depends on every earlier one.\nSigning the entry hash with an asymmetric key binds the decision to the key holder. Ed25519 signatures are compact and deterministic. Separating the key that a machine verifier uses from the key that a human approver uses makes the distinction between an automatically verified change and a human authorized one machine checkable after the fact rather than a matter of trust.\nExcluding wall clock timestamps from the hashed core keeps a seeded run reproducible while leaving the timestamp visible for audit.\n","injection-normalization.md":"# Obfuscation of prompt injection and normalized matching\nAttackers evade literal signature matching by splitting words with hyphens or spaces, inserting zero width characters, varying case, and substituting digits and symbols for letters in the style known as leetspeak, where zero replaces the letter o, three replaces e, one replaces i, and the dollar sign or five replaces s.\nA scanner should therefore match against several views of the same input: the raw text, a normalized form with punctuation collapsed and zero width characters stripped, and a squeezed form with all non alphanumeric characters removed. Character class generalization of a signature covers the leetspeak substitutions without widening the signature to unrelated text.\nAny new signature must be tested against benign traffic before adoption, because a signature that raises the false positive rate degrades a system more reliably than the attack it blocks.\n","ndcg.md":"# Normalized discounted cumulative gain\nDiscounted cumulative gain scores a ranked list by summing the gain of each result divided by a logarithmic discount on its position, so relevant items placed early are worth more than the same items placed late. With graded relevance the gain is usually two to the power of the relevance label minus one.\nNormalized discounted cumulative gain divides the achieved gain by the gain of the ideal ranking, producing a score between zero and one that is comparable across queries of different difficulty. Evaluating at a cutoff k measures only the top k results, which matches how a recall system actually feeds a downstream consumer.\nA linear recall ranker that combines similarity, recency and graph degree can be tuned by adjusting the weight on each term; the best weights approximate the hidden relevance function.\n","verifier-tiers.md":"# Mechanized gates and the limits of verification\nAutonomy in a self modifying system is bounded by verifier quality: the system can safely improve exactly as far as its checks can distinguish improvement from damage. Changes whose effect is a deterministic scalar can be verified by direct measurement. Changes whose effect is distributional require a statistical test on a reserved slice. Changes with no fast objective verifier, such as spending money or taking an action that cannot be undone outside the sandbox, should be escalated to a human rather than approximated.\nThe criterion for escalation is therefore the absence of a verifier, not the apparent seriousness of the change. Recording that criterion explicitly prevents the gradual reclassification of unverifiable actions as routine.\n"},"src":{"util.js":"// util.js — hashing, signatures, seeded PRNG, distributions, stats. Node builtins only.\nimport crypto from \"node:crypto\";\nimport fs from \"node:fs\";\nimport path from \"node:path\";\n\n// BROWSER-REPLACE-START sha256\nexport const sha256 = (s) => crypto.createHash(\"sha256\").update(String(s)).digest(\"hex\");\n// BROWSER-REPLACE-END sha256\nexport const clamp = (x, a, b) => Math.max(a, Math.min(b, x));\n\n// Deterministic stringify (sorted keys) so hashes/signatures are stable.\nexport function stableStringify(v) {\n  if (v === null || typeof v !== \"object\") return JSON.stringify(v);\n  if (Array.isArray(v)) return \"[\" + v.map(stableStringify).join(\",\") + \"]\";\n  return \"{\" + Object.keys(v).sort().map(k => JSON.stringify(k) + \":\" + stableStringify(v[k])).join(\",\") + \"}\";\n}\n\n// xorshift32 PRNG — every stochastic step in the system draws from a seeded rng.\nexport function makeRng(seed) {\n  let s = (seed >>> 0) || 0x2f6e2b1;\n  const next = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };\n  let spare = null;\n  const rng = () => next();\n  rng.int = (n) => Math.floor(next() * n);\n  rng.pick = (arr) => arr[rng.int(arr.length)];\n  rng.range = (a, b) => a + (b - a) * next();\n  rng.gauss = () => {\n    if (spare !== null) { const v = spare; spare = null; return v; }\n    let u = 0, v = 0; while (u === 0) u = next(); while (v === 0) v = next();\n    const m = Math.sqrt(-2 * Math.log(u)), th = 2 * Math.PI * v;\n    spare = m * Math.sin(th); return m * Math.cos(th);\n  };\n  rng.state = () => s;\n  return rng;\n}\n\n// Marsaglia–Tsang gamma, then Beta — real Thompson sampling needs real Beta draws.\nexport function gammaSample(rng, k) {\n  if (k < 1) { const u = rng(); return gammaSample(rng, k + 1) * Math.pow(u, 1 / k); }\n  const d = k - 1 / 3, c = 1 / Math.sqrt(9 * d);\n  for (;;) {\n    let x, v;\n    do { x = rng.gauss(); v = 1 + c * x; } while (v <= 0);\n    v = v * v * v;\n    const u = rng();\n    if (u < 1 - 0.0331 * x * x * x * x) return d * v;\n    if (Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v;\n  }\n}\nexport const betaSample = (rng, a, b) => { const x = gammaSample(rng, a), y = gammaSample(rng, b); return x / (x + y); };\n\nexport const mean = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;\nexport const stdev = (a) => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };\n\n// Percentile-bootstrap CI on mean(a) - mean(b). Seeded ⇒ deterministic significance tests.\nexport function bootstrapDiff(a, b, rng, iters = 800, alpha = 0.05) {\n  if (!a.length || !b.length) return { diff: 0, lo: 0, hi: 0 };\n  const diffs = [];\n  for (let i = 0; i < iters; i++) {\n    let sa = 0, sb = 0;\n    for (let j = 0; j < a.length; j++) sa += a[rng.int(a.length)];\n    for (let j = 0; j < b.length; j++) sb += b[rng.int(b.length)];\n    diffs.push(sa / a.length - sb / b.length);\n  }\n  diffs.sort((x, y) => x - y);\n  const lo = diffs[Math.floor(alpha / 2 * iters)], hi = diffs[Math.floor((1 - alpha / 2) * iters)];\n  return { diff: mean(a) - mean(b), lo, hi };\n}\n\n// ed25519 identity for the verifier (and a separate human key for Tier C).\n// BROWSER-REPLACE-START keys\nexport function loadOrCreateKeys(dir, name) {\n  fs.mkdirSync(dir, { recursive: true });\n  const priv = path.join(dir, name + \".priv.pem\"), pub = path.join(dir, name + \".pub.pem\");\n  if (!fs.existsSync(priv)) {\n    const { publicKey, privateKey } = crypto.generateKeyPairSync(\"ed25519\");\n    fs.writeFileSync(priv, privateKey.export({ type: \"pkcs8\", format: \"pem\" }));\n    fs.writeFileSync(pub, publicKey.export({ type: \"spki\", format: \"pem\" }));\n  }\n  return {\n    sign: (data) => crypto.sign(null, Buffer.from(data), fs.readFileSync(priv)).toString(\"base64\"),\n    verify: (data, sig) => { try { return crypto.verify(null, Buffer.from(data), fs.readFileSync(pub), Buffer.from(sig, \"base64\")); } catch { return false; } },\n    pubPem: () => fs.readFileSync(pub, \"utf8\"),\n  };\n}\n// BROWSER-REPLACE-END keys\n\nexport const nowIso = () => new Date().toISOString();\nexport const tokenize = (s) => String(s).toLowerCase().replace(/[^a-z0-9$.]+/g, \" \").split(\" \").filter(w => w.length > 1);\nexport const numbersIn = (s) => (String(s).match(/-?\\d+(?:\\.\\d+)?/g) || []).map(x => x.replace(/\\.0+$/, \"\"));\n","journal.js":"// journal.js — append-only, hash-chained, signature-carrying event log.\n// INVARIANT I1: nothing in the system mutates history; corrections supersede.\n// Hash covers the stable core (not the wall-clock ts), so a seeded run is\n// bit-for-bit reproducible — the audit replays it and compares chains.\nimport fs from \"node:fs\";\nimport { sha256, stableStringify, nowIso } from \"./util.js\";\n\nexport class Journal {\n  constructor(file) { this.file = file; if (!fs.existsSync(file)) fs.writeFileSync(file, \"\"); }\n  _lastHash() {\n    const lines = fs.readFileSync(this.file, \"utf8\").trim();\n    if (!lines) return \"GENESIS\";\n    const rows = lines.split(\"\\n\");\n    return JSON.parse(rows[rows.length - 1]).hash;\n  }\n  append(core, signer = null) {\n    const prev = this._lastHash();\n    const hash = sha256(prev + stableStringify(core));\n    const entry = { core, prev, hash, ts: nowIso() };\n    if (signer) entry.sig = signer.sign(hash);\n    fs.appendFileSync(this.file, JSON.stringify(entry) + \"\\n\");\n    return entry;\n  }\n  read() {\n    const t = fs.readFileSync(this.file, \"utf8\").trim();\n    return t ? t.split(\"\\n\").map(l => JSON.parse(l)) : [];\n  }\n  verify(verifier = null) {\n    let prev = \"GENESIS\";\n    const rows = this.read();\n    for (let i = 0; i < rows.length; i++) {\n      const e = rows[i];\n      if (e.prev !== prev) return { ok: false, at: i, reason: \"broken chain (prev mismatch)\" };\n      if (sha256(prev + stableStringify(e.core)) !== e.hash) return { ok: false, at: i, reason: \"hash mismatch (tamper)\" };\n      if (e.sig && verifier && !verifier.verify(e.hash, e.sig)) return { ok: false, at: i, reason: \"bad signature\" };\n      prev = e.hash;\n    }\n    return { ok: true, entries: rows.length };\n  }\n  chainHead() { return this._lastHash(); }\n}\n","wiki.js":"// wiki.js — the Knowledge Galaxy as a CONTROL SURFACE, not a mirror.\n// Design move that closes the recursion: governed parameters θ live in page\n// frontmatter. The kernel READS θ from here each cycle; landed diffs CHANGE\n// behavior next cycle. Pages are markdown with [[Wikilinks]]; the graph and\n// blast-radius map are parsed from links, Obsidian-style.\n//\n// Frontmatter format (machine-perfect, no YAML ambiguity):\n//   ---json\n//   { \"slug\":..., \"title\":..., \"sys\":..., \"params\":{...}, \"bounds\":{...},\n//     \"behavioral\":[...], \"evals\":[...], \"invariants\":[...] }\n//   ---\n//\n// INVARIANTS enforced here:\n//   I1  body is append-only — the only body mutation is appendUpdate()\n//   I2  param changes must respect declared [lo,hi] bounds\n//   I3  protected namespaces (declared on om-arch) never change autonomously\nimport fs from \"node:fs\";\nimport path from \"node:path\";\nimport { nowIso } from \"./util.js\";\n\nconst FM_OPEN = \"---json\", FM_CLOSE = \"---\";\n\nexport function parsePage(raw, file) {\n  const lines = raw.split(\"\\n\");\n  if (lines[0].trim() !== FM_OPEN) throw new Error(\"missing ---json frontmatter: \" + file);\n  let i = 1; const fmLines = [];\n  while (i < lines.length && lines[i].trim() !== FM_CLOSE) { fmLines.push(lines[i]); i++; }\n  const fm = JSON.parse(fmLines.join(\"\\n\"));\n  const body = lines.slice(i + 1).join(\"\\n\");\n  return { ...fm, body };\n}\nexport function serializePage(p) {\n  const { body, ...fm } = p;\n  return FM_OPEN + \"\\n\" + JSON.stringify(fm, null, 1) + \"\\n\" + FM_CLOSE + \"\\n\" + body;\n}\nexport const wikilinks = (body) => [...String(body).matchAll(/\\[\\[([^\\]|]+)(?:\\|[^\\]]*)?\\]\\]/g)].map(m => m[1].trim());\n\nexport class Wiki {\n  constructor(dir) { this.dir = dir; this.reload(); }\n  reload() {\n    this.pages = {};\n    for (const f of fs.readdirSync(this.dir).filter(x => x.endsWith(\".md\"))) {\n      const p = parsePage(fs.readFileSync(path.join(this.dir, f), \"utf8\"), f);\n      this.pages[p.slug] = p;\n    }\n    this.titleToSlug = {};\n    for (const p of Object.values(this.pages)) this.titleToSlug[p.title] = p.slug;\n  }\n  page(slug) { const p = this.pages[slug]; if (!p) throw new Error(\"no page: \" + slug); return p; }\n  _write(p) { fs.writeFileSync(path.join(this.dir, p.slug + \".md\"), serializePage(p)); }\n\n  // Collected governed parameters: { \"<slug>.<key>\": value }\n  theta() {\n    const out = {};\n    for (const p of Object.values(this.pages))\n      for (const [k, v] of Object.entries(p.params || {})) out[p.slug + \".\" + k] = v;\n    return out;\n  }\n  boundsOf(slug, key) { return (this.page(slug).bounds || {})[key] || null; }\n  isBehavioral(slug, key) { return (this.page(slug).behavioral || []).includes(key); }\n  protectedNamespaces() { return this.page(\"om-arch\").protectedNamespaces || []; }\n  isProtected(slug, key) {\n    const full = slug + \".\" + key;\n    return this.protectedNamespaces().some(ns => full === ns || full.startsWith(ns));\n  }\n\n  graph() {\n    const nodes = Object.values(this.pages).map(p => ({ slug: p.slug, title: p.title, sys: p.sys, degree: 0 }));\n    const bySlug = Object.fromEntries(nodes.map(n => [n.slug, n]));\n    const edges = [];\n    for (const p of Object.values(this.pages))\n      for (const t of wikilinks(p.body)) {\n        const to = this.titleToSlug[t];\n        if (to && to !== p.slug) { edges.push({ from: p.slug, to }); bySlug[p.slug].degree++; bySlug[to].degree++; }\n      }\n    return { nodes, edges };\n  }\n  // Blast radius: evals of the page itself plus every page linked either direction.\n  bla
