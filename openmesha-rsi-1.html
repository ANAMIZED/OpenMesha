/* ════════════════════════════════════════════════════════════════════════
   OpenMesha (OM) · Open Agentic Operations Mesh — OpenHarness × QMesha
   Unification of OpenHarness (spectral mission-control + canvas engines)
   and QMesha (voice copilot + quantum + agent economy + backend mesh).
   Single self-contained module. High-fidelity in-browser simulation with
   real algorithms; every backend seam is marked  // WIRE:  with the real
   framework it maps to. Swap Kernel/Backend bodies for live fetch() to go live.
   ════════════════════════════════════════════════════════════════════════ */

/* ── design tokens: hue carries subsystem identity (spectral wayfinding) ── */
const C = {
  void:"#06080d", panel:"#0b0f16", panel2:"#0f141d", panel3:"#141b26",
  line:"#1a222e", line2:"#28333f", line3:"#3a4a5e",
  ink:"#e8eef5", ink2:"#93a2b6", ink3:"#5c6a80", ink4:"#3a4454", faint:"#2a3340",
  route:"#57e7c6", mem:"#b48cf6", agent:"#ffb454", compute:"#5ba8ff",
  improve:"#ff6f9d", sec:"#ff5d5d", commerce:"#54e08f", gw:"#ffcf3a", quantum:"#8ef0ff",
  cyan:"#34e0d8", violet:"#8e84f5", gold:"#f5c451", green:"#4fd68a", pink:"#ff6f9d",
  blue:"#5ba8ff", red:"#fb6b6b",
  good:"#57e7c6", warn:"#ffb454", bad:"#ff5d79",
  mono:'ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace',
  sans:'system-ui,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif',
};window.__OM_C=C;
const SUB = C; // alias

/* ── deterministic-ish PRNG + math (Thompson sampling needs real Beta/Gamma) ─ */
let _seed = 0x2f6e2b1;
const R = () => { _seed ^= _seed<<13; _seed ^= _seed>>>17; _seed ^= _seed<<5; return ((_seed>>>0)%1e7)/1e7; };
const rnd = (a=0,b=1)=>a+(b-a)*R();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[(R()*a.length)|0];
const uid=p=>(p||"id")+"_"+Math.random().toString(36).slice(2,9);
const fmtN=n=>n>=1e9?(n/1e9).toFixed(1)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(Math.round(n));
const fmtUSD=(n,d=0)=>"$"+(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>{const v=Number(n)||0;return v<10?"$"+v.toFixed(2):fmtUSD(v);};
function gauss(){let u=0,v=0;while(u===0)u=R();while(v===0)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const sigmoid=x=>1/(1+Math.exp(-x));
const LG=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
function logGamma(z){if(z<0.5)return Math.log(Math.PI/Math.sin(Math.PI*z))-logGamma(1-z);z-=1;let x=LG[0];for(let i=1;i<9;i++)x+=LG[i]/(z+i);const t=z+7.5;return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);}
function logBeta(a,b){return logGamma(a)+logGamma(b)-logGamma(a+b);}
function betaPDF(x,a,b){if(x<=0||x>=1)return 0;return Math.exp((a-1)*Math.log(x)+(b-1)*Math.log(1-x)-logBeta(a,b));}
function sampleGamma(k){if(k<1)return sampleGamma(1+k)*Math.pow(R(),1/k);const d=k-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=gauss();v=1+c*x;}while(v<=0);v=v*v*v;const u=R();if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}}
function sampleBeta(a,b){const x=sampleGamma(a),y=sampleGamma(b);return x/(x+y)||0.5;}
/* tiny FNV-ish hash for "SHA-256"-style source fingerprints in RKI */
function sha(s){let h=0x811c9dc5;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(16).padStart(8,"0")+(Math.imul(h,0x85ebca6b)>>>0).toString(16).padStart(8,"0");}
const now=()=>Date.now();
const clock=()=>new Date().toTimeString().slice(0,8);

/* ════════════════════════ UNIFIED KERNEL ═════════════════════════════════
   One source of truth for every subsystem. Real algorithms; WIRE seams noted.
   ═════════════════════════════════════════════════════════════════════════ */
function createKernel(){
  let killed=false; /* Control Tower kill switch — declared first: settleOutcome/payX402 guard on it during seeding */
  /* ── Model Router: multi-armed bandit (Thompson / UCB1 / ε-greedy / ctx) ──
     WIRE: LiteLLM (self-hosted control plane) + OpenRouter — POST /inference {model,messages}
     · TensorZero archived Jun 2026 — do not wire · Router-R1/RouteLLM = research refs only */
  const arms=[
    {model:"claude-opus-4-8",  a:9, b:3, n:120, rs:0, cost:0.015, lat:820, q:0, w:[.9,.5,.7,.4]},
    {model:"claude-sonnet-4-6",a:14,b:4, n:210, rs:0, cost:0.006, lat:430, q:0, w:[.8,.7,.6,.6]},
    {model:"claude-haiku-4-5", a:8, b:5, n:180, rs:0, cost:0.001, lat:180, q:0, w:[.6,.9,.4,.8]},
    {model:"gpt-class-mini",   a:6, b:6, n:90,  rs:0, cost:0.0008,lat:210, q:0, w:[.55,.85,.45,.75]},
    {model:"local-vLLM-70B",   a:7, b:6, n:70,  rs:0, cost:0.0002,lat:520, q:0, w:[.65,.6,.9,.9]},
  ];
  arms.forEach(x=>{x.q=x.a/(x.a+x.b);x.rs=x.q*x.n;});
  let policy="thompson";
  const ctxFit=(x,f)=>sigmoid(x.w[0]*f[0]+x.w[1]*f[1]+x.w[2]*f[2]+x.w[3]*f[3]-0.4);
  function score(x,f,t){
    if(policy==="thompson")return sampleBeta(x.a,x.b);
    if(policy==="ucb1"){const N=arms.reduce((s,a)=>s+a.n,0);return x.q+Math.sqrt(2*Math.log(N+1)/(x.n+1));}
    if(policy==="egreedy")return R()<0.1?R():x.q;
    if(policy==="contextual")return 0.55*x.q+0.45*ctxFit(x,f);
    return x.q;
  }
  function route(feat){
    const f=feat||[R(),R(),R(),R()];
    let best=null,bv=-1e9;arms.forEach(x=>{if(x.retired)return;const s=score(x,f);if(s>bv){bv=s;best=x;}});best=best||arms[0];
    const quality=clamp(0.55*best.q+0.45*ctxFit(best,f)+rnd(-0.08,0.08),0,1);
    const reward=clamp(0.7*quality+0.3*(1-clamp(best.cost/0.02,0,1)),0,1);
    best.a+=reward;best.b+=1-reward;best.n++;best.rs+=reward;best.q=best.a/(best.a+best.b);
    return {chosen:best.model,reward:+reward.toFixed(3),quality:+quality.toFixed(3),cost:best.cost,lat:best.lat};
  }
  function setPolicy(p){policy=p;}

  /* ── Agentic Memory: temporal knowledge graph (force-directed) ──
     WIRE: Mem0 (default) + Graphiti/Zep (temporal facts) — /memories/search?q= · Letta for long-running state */
  const TYPES={episodic:C.mem,semantic:"#b48cf6",procedural:"#8f6fd6",working:"#e0ccff",entity:"#9d7be8"};
  let nodes=[],edges=[],W=600,H=420;
  function seedMem(){
    const seeds=[["entity","OpenMesha core"],["semantic","x402 protocol"],["procedural","route→execute→reflect"],["episodic","council #4471"],["semantic","EIP-712 auth"],["entity","Treasury"],["procedural","QAOA solve"],["episodic","security scan pass"],["semantic","Thompson sampling"],["entity","MCP gateway"]];
    seeds.forEach(([t,l],i)=>nodes.push({id:uid("m"),type:t,label:l,x:W/2+rnd(-120,120),y:H/2+rnd(-90,90),vx:0,vy:0,heat:1,deg:0}));
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++)if(R()<0.28)edges.push({a:nodes[i].id,b:nodes[j].id,vt:now()-((R()*6e5)|0)});
    recompDeg();
  }
  function recompDeg(){nodes.forEach(n=>n.deg=0);edges.forEach(e=>{const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(a)a.deg++;if(b)b.deg++;});}
  function addMem(type,label){const n={id:uid("m"),type:type||pick(Object.keys(TYPES)),label:label||"memory "+(nodes.length+1),x:W/2+rnd(-40,40),y:H/2+rnd(-40,40),vx:0,vy:0,heat:1,deg:0};nodes.push(n);const k=Math.min(2,nodes.length-1);for(let i=0;i<k;i++){const o=pick(nodes.filter(m=>m.id!==n.id));if(o)edges.push({a:n.id,b:o.id});}recompDeg();return n;}
  let lastRecall=null;
  function recall(q){nodes.forEach(n=>{if(n.label.toLowerCase().includes(String(q||"").toLowerCase()))n.heat=1;});
    const hits=nodes.filter(n=>n.label.toLowerCase().includes(String(q||"").toLowerCase())).slice(0,6);
    const est=Math.max(8,Math.round((String(q||"").length+hits.reduce((s,n)=>s+n.label.length+24,0))/4));
    const full=Math.max(est,Math.round(nodes.reduce((s,n)=>s+n.label.length+24,0)/4));
    lastRecall={tokens:est,full,x:+(full/est).toFixed(1),hits:hits.length,ts:now()};
    return hits;}
  function recallStat(){if(!lastRecall)recall("protocol");return lastRecall;}
  let retiredEdges=[];
  function retireEdge(e){e.it=now();retiredEdges.unshift(e);if(retiredEdges.length>60)retiredEdges.pop();}
  function consolidate(){for(let i=nodes.length-1;i>=0;i--)if(nodes[i].heat<0.12&&nodes[i].deg<=1&&nodes.length>8){const id=nodes[i].id;nodes.splice(i,1);edges=edges.filter(e=>{const keep=e.a!==id&&e.b!==id;if(!keep)retireEdge(e);return keep;});}recompDeg();}
  function memBitemporal(){return {active:edges.length,retired:retiredEdges.length,lastRetired:retiredEdges[0]||null,avgAgeMin:edges.length?Math.round(edges.reduce((s,e)=>s+(now()-(e.vt||now())),0)/edges.length/6e4):0};}
  function memTick(dt){
    for(const n of nodes){n.vx*=0.86;n.vy*=0.86;}
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;const rep=1400/(d*d);a.vx+=dx/d*rep;a.vy+=dy/d*rep;b.vx-=dx/d*rep;b.vy-=dy/d*rep;}
    edges.forEach(e=>{const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;const f=(d-96)*0.012;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;});
    const cx=W/2,cy=H/2;for(const n of nodes){n.vx+=(cx-n.x)*0.002;n.vy+=(cy-n.y)*0.002;n.x=clamp(n.x+n.vx*dt,20,W-20);n.y=clamp(n.y+n.vy*dt,20,H-20);n.heat=Math.max(0,n.heat-0.004*dt);}
  }
  function memSize(w,h){W=w;H=h;}

  /* ── Meta & Swarm Agents + weighted Council ──
     WIRE: LangGraph primary (checkpointing) + Claude Agent SDK for the council — graph.invoke(state) */
  const ROLES=[{k:"Meta",w:1.0},{k:"Planner",w:.9},{k:"Router",w:.7},{k:"Coder",w:.85},{k:"Critic",w:.8},{k:"Memory",w:.7},{k:"Tooling",w:.75}];
  const COUNCIL=[["Strategist",.22],["Risk",.2],["Market",.16],["Tech",.16],["Ethics",.14],["Finance",.12]];
  function planFor(goal){const verbs=["Decompose","Retrieve context for","Route model for","Draft plan for","Execute","Self-critique","Reflect & store"];return verbs.map((v,i)=>({i,step:v+" · "+String(goal||"goal").slice(0,42)}));}
  function deliberate(proposal){
    const votes=COUNCIL.map(([role,w])=>{const p=clamp(0.5+rnd(-0.35,0.4)+(String(proposal).length%7)/40,0.02,0.98);return {role,w,p,vote:p>0.55?"yes":p<0.42?"no":"abstain"};});
    const consensus=clamp(votes.reduce((s,v)=>s+v.w*v.p,0)/votes.reduce((s,v)=>s+v.w,0),0,1);
    const tally={yes:votes.filter(v=>v.vote==="yes").length,no:votes.filter(v=>v.vote==="no").length,abstain:votes.filter(v=>v.vote==="abstain").length};
    return {proposal,consensus:+consensus.toFixed(3),votes:tally,detail:votes};
  }

  /* ── Compute Arbitrage: spot routing across GPU providers ──
     WIRE: Akash / io.net / Vast / Lambda / Spheron — GET /providers/bids */
  const SKUS={H100:4.9,A100:3.2,L40S:1.8,RTX4090:0.95};
  const provs=[
    {id:"akash",name:"Akash",rel:0.94,px:{H100:2.10,A100:1.35,L40S:0.72,RTX4090:0.34},avail:{H100:12,A100:40,L40S:60,RTX4090:120}},
    {id:"io",name:"io.net",rel:0.9,px:{H100:1.98,A100:1.28,L40S:0.68,RTX4090:0.31},avail:{H100:8,A100:30,L40S:80,RTX4090:200}},
    {id:"vast",name:"Vast",rel:0.86,px:{H100:1.79,A100:1.19,L40S:0.61,RTX4090:0.27},avail:{H100:5,A100:22,L40S:44,RTX4090:300}},
    {id:"lambda",name:"Lambda",rel:0.97,px:{H100:2.49,A100:1.55,L40S:0.9,RTX4090:0.44},avail:{H100:20,A100:60,L40S:30,RTX4090:40}},
    {id:"spheron",name:"Spheron",rel:0.88,px:{H100:1.88,A100:1.22,L40S:0.63,RTX4090:0.29},avail:{H100:6,A100:26,L40S:52,RTX4090:150}},
  ];
  let sku="H100";
  const effective=p=>p.px[sku]*(1+(1-p.rel)*0.6);
  function bestProvider(){let b=null,bv=1e9;provs.forEach(p=>{if(p.avail[sku]<=0)return;const e=effective(p);if(e<bv){bv=e;b=p;}});return b;}
  let compSaved=14260+((R()*4000)|0), compSpent=9080+((R()*3000)|0), compHours=3820+((R()*600)|0);
  function bookCompute(q){compSaved+=q.savings;compSpent+=q.spot;compHours+=q.gpuHours;}
  function computeSavings(){const pct=(compSaved+compSpent)>0?Math.round(compSaved/(compSaved+compSpent)*100):0;return {saved:+compSaved.toFixed(2),spent:+compSpent.toFixed(2),hours:compHours|0,pct};}

const LocalLLM={status:"off",progress:"",model:null,mode:"cloud",engine:null,stats:{calls:0,ms:0},subs:new Set(),

const WIKI=[
  {slug:"om-arch",title:"OpenMesha Architecture",group:"core",sys:"system",tags:["overview","mesh"],body:"# OpenMesha Architecture\nOpenMesha unifies a model-agnostic agentic harness with a sovereign agent economy. One [[The Kernel]] drives every subsystem; the [[Voice Copilot]] is the primary control surface and the [[Mission Console]] is the instrument panel.\n\nEvery money-moving action routes through [[Human-on-the-Loop]] approval. Backend seams are marked WIRE and hydrate from a real control plane over SSE when reachable."},
  {slug:"kernel",title:"The Kernel",group:"core",sys:"system",tags:["kernel","state"],body:"# The Kernel\nA single in-browser engine that owns all algorithms: the [[Model Router]] bandits, the [[Temporal Memory Graph]], [[LLM Council]] scoring, [[Compute Arbitrage]] quotes, [[AgentFence Security]] scans, [[x402 Payments]] and the [[Quantum Solvers]].\n\nPages never duplicate logic — they render kernel state. Swapping the kernel for fetch() calls against a control plane is the entire deployment story."},
  {slug:"console",title:"Mission Console",group:"core",sys:"system",tags:["console","bus","palette"],body:"# Mission Console\nThe operator's instrument panel: live Thompson posteriors, the memory graph, the optimization bowl, and a filterable event bus fed by every subsystem.\n\nA kernel command line accepts route, scan, qaoa, quote, improve and recall. The command palette (⌘K) jumps anywhere in the mesh."},
  {slug:"tracing",title:"Distributed Tracing",group:"core",sys:"system",tags:["traces","spans"],body:"# Distributed Tracing\nEvery goal decomposes into spans — plan, route, execute, critique, store — with per-span latency and cost. Traces make the [[Orchestrator & Goals]] loop auditable and feed [[Learning Curves]]. Spans export in OpenTelemetry **gen_ai.*** semantic conventions \u2014 chat, invoke_agent, execute_tool \u2014 so traces stay vendor-portable."},
  {slug:"voice-copilot",title:"Voice Copilot",group:"governance",sys:"system",tags:["voice","assistant","hotl"],body:"# Voice Copilot\nA hands-free control surface you can **speak or type** to. Explicit commands and the money-gate run **locally and offline**; open questions go to a live-context LLM with a deterministic fallback.\n\nMoney-moving requests are **propose-only by voice** — the copilot raises a pending item in [[Human-on-the-Loop]] and requires a second factor. The copilot also curates this [[Knowledge Galaxy]]: telemetry auto-syncs, prose edits arrive as approvable diffs. The **jarvis** pattern (Nous Hermes Agent\u2019s voice layer: wake-word, local Whisper, barge-in, spoken briefings) maps onto this copilot with one doctrinal difference \u2014 Jarvis grants raw terminal and file access; here the same power runs through the act-gate and [[Human-on-the-Loop]]. Wake-word and barge-in are WIRE candidates; the spoken daily briefing is the digest, one speechSynthesis call away."},
  {slug:"hotl",title:"Human-on-the-Loop",group:"governance",sys:"sec",tags:["approval","governance"],body:"# Human-on-the-Loop\nThe governance chokepoint. Any high-agency action — funding a deal from [[Treasury]], a data purchase, a [[Knowledge Galaxy]] prose diff — pauses in the approval queue with risk grading.\n\nApprove applies the action atomically; reject discards it. Voice can propose but never authorize. The page now opens with a **Control Tower** \u2014 the ServiceNow-pattern command surface: discover / observe / govern / secure / measure across every arm, tool, and agent, **policy-as-code** you can copy out, and a **kill switch** that halts the ambient economy, x402 charges, and outcome settlement in one action while reads stay open. Money never needed the switch \u2014 it was already human-gated. Beside the tower sits the **Production Readiness Score** \u2014 a Producting-pattern rollup across security (live, from the Petri harness), observability, resilience, governance, deployment, cost, and compliance \u2014 recursive self-hardening: the mesh scoring itself, with every gap named as a WIRE. OpenMesha follows Anthropic\u2019s safe-agent framework: read-only by default, human approval before irreversible or money-moving actions, always stoppable via the Control Tower kill switch, and reasoning made visible through OTel spans and hashed receipts.\n\nEvery money-moving or high-risk item now mints an **AP2-pattern mandate**: intent signed at proposal (WebCrypto ECDSA P-256, **hybrid ML-DSA-65** once the [[PQC Migration OS]] signer loads), authorized into a cart mandate by the approve tap, voided on reject \u2014 the human decision itself becomes a machine-verifiable, expiring artifact."},
  {slug:"security",title:"AgentFence Security",group:"security",sys:"sec",tags:["owasp","redteam"],body:"# AgentFence Security\nContinuous red/blue exercise over the OWASP agentic top-10: prompt injection, tool abuse, memory poisoning, excessive agency. Inbound text is scanned against injection signatures; posture hardens from findings.\n\nHigh-risk verdicts escalate to [[Human-on-the-Loop]] and are journaled to [[Distributed Tracing]]. Defense is **two-layer** (the Claude Code auto-mode pattern): L1 (**scan-on-ingest**) screens every tool output and inbound message before it reaches an agent, wrapping flagged content as data rather than instructions; L2 (**act-gate**) gates the resulting action, escalating anything irreversible or money-moving to [[Human-on-the-Loop]]. A **Petri**-pattern harness runs seed probes through both layers and scores catch-rate against false positives \u2014 an external safety fitness signal for the self-improvement loop (WIRE: Petri v3.0 + Bloom against live endpoints).\n\n**Supply-chain defense** joined the layers: skills sign, dependencies pin, upstream mounts scan on ingest \u2014 the registry gate lives on [[Marketplaces]], and the [[PQC Migration OS]] tracks the crypto those signatures rest on."},
  {slug:"router",title:"Model Router",group:"routing",sys:"route",tags:["bandit","routing"],body:"# Model Router\nEvery request is routed across model arms by a multi-armed bandit — see [[Thompson Sampling]] — on a blended quality, latency and cost reward. Policies: Thompson, UCB1, ε-greedy, contextual.\n\nArm posteriors render live in the [[Mission Console]]; reward drift feeds [[Learning Curves]]. The **routing dividend** is measured against an explicit counterfactual \u2014 every call sent to the premium-only arm \u2014 and the saved percentage, not the dollar figure, is the durable claim."},
  {slug:"thompson",title:"Thompson Sampling",group:"routing",sys:"route",tags:["mab","beta"],body:"# Thompson Sampling\nEach arm keeps a Beta(α,β) posterior over reward. A call samples θ~Beta per arm and picks the max — exploration falls out of uncertainty for free. Wins increment α, losses β.\n\nThe [[Model Router]] uses it as the default policy."},
  {slug:"memory",title:"Temporal Memory Graph",group:"intelligence",sys:"mem",tags:["graph","recall"],body:"# Temporal Memory Graph\nEpisodic, semantic, procedural and reflective nodes in a force-directed graph with temporal decay. Recall is similarity + recency + degree; consolidation merges near-duplicates. Edges are **bitemporal** \u2014 valid_at on creation, invalid_at on retirement, never deleted \u2014 and recall is token-metered against the full-context counterfactual.\n\nNew experience arrives through [[Recursive Knowledge Improvement]]; distilled knowledge lands in the [[Knowledge Galaxy]]."},
  {slug:"wiki-galaxy",title:"Knowledge Galaxy",group:"intelligence",sys:"mem",tags:["wiki","obsidian","graph"],body:"# Knowledge Galaxy\nThe system's self-model: one page per subsystem, cross-linked into a navigable 3D constellation — drag to orbit, pinch or scroll to zoom, tap a star to read.\n\nEach page carries **live telemetry auto-synced by the copilot**. Prose changes are append-only: the [[Voice Copilot]] proposes diffs which clear [[Human-on-the-Loop]] before landing, per [[Recursive Knowledge Improvement]]. Edges are parsed straight from wikilinks and stars scale with link degree \u2014 Obsidian\u2019s graph mechanics, native. Every note copies out with YAML frontmatter for a vault, and the header exports **graph.json** for Graphify-style knowledge pipelines."},
  {slug:"rki",title:"Recursive Knowledge Improvement",group:"learning",sys:"improve",tags:["rki","sources"],body:"# Recursive Knowledge Improvement\nRaw inputs — documents, tool outputs, council transcripts, edits — are ingested as **append-only sources**, hashed, tagged and scored. Nothing is overwritten; corrections supersede.\n\nSynthesis produces propose-only diffs into the [[Knowledge Galaxy]] and fresh nodes for the [[Temporal Memory Graph]]."},
  {slug:"improve",title:"Self-Improvement Loop",group:"learning",sys:"improve",tags:["optuna","dspy"],body:"# Self-Improvement Loop\nA (1+1) evolution strategy over the system's own hyperparameters: perturb the incumbent with N(0,σ), keep strictly-better candidates, and adapt σ by the 1/5th-success rule — widening to explore, shrinking to exploit. The best-so-far ratchets monotonically.\n\nWIRE seams map to **GEPA** (reflective evolution over execution traces), DSPy, Optuna, Ray Tune and DEAP. Results feed [[Learning Curves]] and retune the [[Model Router]]."},
  {slug:"learning",title:"Learning Curves",group:"learning",sys:"improve",tags:["reward","loss"],body:"# Learning Curves\nLongitudinal reward and loss over every trial and route. Rising reward with falling variance is the health signal for the [[Self-Improvement Loop]]; regressions page the operator via notifications."},
  {slug:"agents",title:"Orchestrator & Goals",group:"agents",sys:"agent",tags:["planning","goals"],body:"# Orchestrator & Goals\nA meta-agent decomposes goals into plans, routes each step through the [[Model Router]], executes, self-critiques and stores to the [[Temporal Memory Graph]].\n\nContested decisions escalate to the [[LLM Council]]; parallel work fans out to the [[Agent Swarm]]. An **Agent Studio** panel defines new mesh agents at runtime \u2014 name, capabilities, trust \u2014 each auto-provisioned with the reachability triad and a trust-scaled spend cap under [[Human-on-the-Loop]]. Beside it sits **The Foundry**: one sentence from the operator \u2014 typed or spoken \u2014 compiles a full sibling-MAOS spec (invariants inherited, pages, streams, governance, charter) with deploy gated by HOTL; generation executes through the control plane\u2019s agent seam."},
  {slug:"council",title:"LLM Council",group:"agents",sys:"agent",tags:["votes","consensus"],body:"# LLM Council\nSix weighted advisor roles — strategist, risk, market, tech, ethics, finance — deliberate and vote. Consensus is the weighted mean of confidences; below threshold the motion fails or escalates to [[Human-on-the-Loop]].\n\nSeats convene as **live LLM advisors** when a model endpoint is reachable — each argues in turn, hearing prior seats, with per-seat synthesized voices — and fall back to the deterministic kernel offline. Transcripts are ingested as sources by [[Recursive Knowledge Improvement]]."},
  {slug:"swarm",title:"Agent Swarm",group:"agents",sys:"agent",tags:["parallel","workers"],body:"# Agent Swarm\nEphemeral sub-agents spawn per plan branch, execute in parallel and dissolve. Placement follows [[Compute Arbitrage]]; every worker inherits the [[AgentFence Security]] policy and reports spans to [[Distributed Tracing]]."},
  {slug:"compute",title:"Compute Arbitrage",group:"compute",sys:"compute",tags:["spot","gpu"],body:"# Compute Arbitrage\nLive spot quotes across Akash, io.net, Vast, Lambda and Spheron, reliability-adjusted to an effective $/hr. The kernel books the best provider per SKU and reports savings versus on-demand.\n\nWorkloads from the [[Agent Swarm]] and [[Quantum Solvers]] are placed here; spend settles via [[x402 Payments]]. [[Kernel Forge]] stacks efficiency on the same hours \u2014 price \u00d7 kernels is the full dividend."},
  {slug:"kernels",title:"Kernel Forge",group:"compute",sys:"compute",tags:["cuda","triton","kernelbench"],body:"# Kernel Forge\nAI-generated GPU kernels: an agentic loop drafts CUDA/Triton, compiles, checks numerical correctness against the framework reference, profiles wall-clock, and banks only verified wins \u2014 the published pattern behind KernelBench (fast_p), Kevin-style multi-turn RL and Mirage superoptimization.\n\nEvery kept kernel is a permanent efficiency dividend that **stacks on [[Compute Arbitrage]]**: the same GPU-hour does more, so price \u00d7 kernels is the full savings term. Each verified \u22651.2\u00d7 win settles an outcome fee via [[x402 Payments]] \u2014 the most objectively verifiable criterion in the mesh. The forge itself is a concrete instance of the [[Self-Improvement Loop]]: better kernels make the mesh faster, and a faster mesh forges better kernels."},
  {slug:"agentic-quantum",title:"Agentic Quantum",group:"quantum",sys:"quantum",tags:["orchestration","hybrid","nisq"],body:"# Agentic Quantum\nThe bidirectional convergence: agents orchestrate hybrid quantum-classical workflows \u2014 profiling each instance and routing it to the best substrate \u2014 while quantum solvers give agents a decision substrate for intractable subproblems.\n\nOpenMesha implements the near-term half honestly: every routed instance also runs the classical baseline, and the quantum premium settles via [[x402 Payments]] only when the quantum solver verifiably wins. [[Quantum Solvers]] provides the substrates; the [[Model Router]] pattern generalizes from model choice to solver choice. Maturity today is Level 1\u20132 of the four-level model (NISQ-resilient hybrid); Levels 3\u20134 (domain-adaptive, quantum-native) are wired seams.\n\nThe Level-3 seam is now a live surface: the [[Quantum Solvers]] page mounts an upstream Qiskit MCP QPU, and every routed result names its backend."},
  {slug:"quantum",title:"Quantum Solvers",group:"quantum",sys:"quantum",tags:["qaoa","vqe"],body:"# Quantum Solvers\nQAOA solves MaxCut — exact enumeration to 18 nodes, simulated annealing beyond. VQE estimates ground-state energy via parameter sweep.\n\nBoth run as metered endpoints billed through [[x402 Payments]] on hardware placed by [[Compute Arbitrage]]. [[Agentic Quantum]] adds the orchestration layer: route, verify against classical, charge only the dividend.\n\nA **QPU mount** now sits above both solvers: point it at an upstream **Qiskit MCP** server (JSON-RPC \u2014 initialize \u2192 tools/list \u2192 tools/call) and solve jobs route upstream, with results scanned on ingest and the backend + round-trip named on every result. The in-kernel baseline still runs every instance, so the verified-win fee never rests on an unverified upstream claim.\n\nEach upstream dispatch meters **qpu.dispatch** ($0.05) off-chain and batch-nets \u2014 the markup layer on mounted QPU time."},
  {slug:"pqc",title:"PQC Migration OS",group:"security",sys:"quantum",tags:["pqc","hndl","fips","cbom"],body:"# PQC Migration OS\nThe quantum-era wedge made operational: a live **CBOM** (crypto inventory) of every primitive the mesh itself runs, **Mosca-theorem** urgency (X migration + Y shelf life vs Z CRQC arrival), and the regulatory countdown \u2014 FIPS 140-2 to historical (Sep 2026), the EU NIS milestone (Dec 2026), the CNSA 2.0 acquisition gate (Jan 2027), RSA-2048/P-256 deprecated by 2030 and disallowed by 2035.\n\nThe mesh dogfoods its own migration: [[Human-on-the-Loop]] mandates sign **hybrid** \u2014 classical ECDSA plus **ML-DSA-65** (FIPS 204), loaded live in-tab and self-verified before use \u2014 and the same assessment ships as the metered **pqc.scan** endpoint on [[x402 Payments]]. Harvest-now-decrypt-later is the driver: anything with a shelf life past 2030 is exposed today. Crypto-agility is the design rule \u2014 algorithms swap behind one seam, never inline.\n\nThe migration itself is now a stream: **pqc.migrate** charges a base call and settles a **$3 outcome fee only when a CBOM row verifiably flips to hybrid** \u2014 the kernel checks that ML-DSA-65 is loaded and self-verified and that the row is one it actually controls (mandate signatures, skill signing). Rows it can\u2019t flip in-tab \u2014 the x402 curve, TLS \u2014 refuse the fee and stay WIREs."},
  {slug:"x402",title:"x402 Payments",group:"commerce",sys:"commerce",tags:["usdc","base","micropay"],body:"# x402 Payments\nHTTP-native micropayments. A paid endpoint returns **402 Payment Required** with price, asset and recipient; the agent signs an **EIP-712 / EIP-3009** authorization and a facilitator settles gaslessly in USDC on Base.\n\nEvery metered call in the [[Commerce Rail]] and [[MCP Gateway]] flows through this rail. A third layer sits on top: **outcome fees** that settle only on verified results \u2014 hash-stamped receipts, criteria stated upfront, applied solely where the kernel controls the result. A **Hermes oracle** panel pulls live **pyth** price feeds through the control plane \u2014 first-party market data signed on Pythnet, native to Base where the rail settles, every price carrying a confidence interval (uncertainty displayed, never hidden). Pyth Core requires an API key after 2026-07-31; the proxy carries it. OKX.AI\u2019s launch also names the one settlement mode this rail lacks: **escrow** \u2014 funds locked upfront for multi-step work, released on verification. That is the natural evolution of outcome fees (same kernel verification, custody moved earlier), and the CAIP-2 field already reaches Solana \u2014 both scribed as WIREs, not features.\n\nTwo 2026 upgrades are live. **Deposit + off-chain metering** fixes the rail\u2019s own economics \u2014 per-request on-chain settlement breaks when the network fee rivals the call price, so usage accrues as receipts and nets in periodic batches from an on-chain deposit. And an **AP2-pattern mandate layer** now rides above the rail \u2014 see [[Human-on-the-Loop]]."},
  {slug:"commerce",title:"Commerce Rail",group:"commerce",sys:"commerce",tags:["paywalls","txlog"],body:"# Commerce Rail\nThe dogfooded storefront: research, scans, quotes and solvers exposed as paywalled services with a live transaction log. Receipts roll into [[Revenue Engine]]; balances sweep to [[Treasury]].\n\nEvery subsystem ships with a price: per-use via [[x402 Payments]], bundled into subscription tiers, or listed as MCP tools and SKILL.md packages on [[Marketplaces]] — only governance is subscription-only by design. Pricing experiments are run by the [[Self-Improvement Loop]].\n\nAmbient metered usage now flows through **deposit + off-chain metering** on the [[x402 Payments]] rail \u2014 receipts accrue and net in batches instead of settling per request."},
  {slug:"treasury",title:"Treasury",group:"economy",sys:"econ",tags:["runway","rebalance"],body:"# Treasury\nOperating, escrow, reserve and yield ledgers with one-tap rebalance to policy weights. Runway derives live from treasury ÷ gross burn — computed, never seeded, recomputed on every settlement. The yield ledger is an allocation slot: its return stream renders from a stated policy APY, sim-marked until the control-plane feed (WIRE: /api/treasury/yield) hydrates real accrual — nothing accrues into the ledger without [[Human-on-the-Loop]] settlement.\n\nOutbound movements — including [[VC Pipeline]] escrow funding — only execute through [[Human-on-the-Loop]]."},
  {slug:"local-inference",title:"Local Inference",group:"routing",sys:"route",tags:["webllm","webgpu","privacy","tiers"],body:"# Local Inference\nTier-1 of the mesh\u2019s three inference tiers: **T0** \u2014 the deterministic kernel, always on, zero dependencies. **T1** \u2014 WebLLM: open-weight models compiled to WebGPU, running entirely in this tab \u2014 private, zero-key, offline once weights are cached, roughly 80% of native speed, practical ceiling ~8B params. **T2** \u2014 frontier cloud models behind the [[Model Router]].\n\nThe hybrid agentic-OS literature calls smart local-vs-cloud routing \u2018the missing orchestration piece you would build.\u2019 The mesh already built it: a loaded local model registers as a bandit arm at ~zero marginal cost, and the router spends where quality-per-dollar wins. When loaded, the council and [[Voice Copilot]] prefer the local tier, fall back to cloud, then to the kernel \u2014 three tiers, graceful in both directions.\n\nLocal inference is **deliberately unmetered**: charging x402 for compute the user\u2019s own GPU performs would be dishonest. Its value lands as routing dividend, privacy, and an offline SKU. Load models from Settings; WebGPU (Chrome/Edge 113+) required. Ecosystem seams: BrowserOS as a host shell that mounts the mesh\u2019s MCP server; Kernel.sh unikernel cloud browsers as an upstream execution tier."},
  {slug:"packaging",title:"Packaging & Distribution",group:"gateway",sys:"gw",tags:["mcp","registry","skill","plugin"],body:"# Packaging & Distribution\nThe mesh publishes itself four ways, all shipped as manifests in the kit.\n\n**MCP Registry** \u2014 a **server.json** manifest submitted to registry.modelcontextprotocol.io (namespace owned via GitHub OIDC or DNS); the [[MCP Gateway]] server speaks spec **2025-11-25** with version negotiation and tolerates the 2026-07-28 stateless RC (Mcp-Method / Mcp-Name routing headers), with the [[x402 Payments]] 402-flow riding alongside.\n\n**Agent Skill** \u2014 a **SKILL.md** (YAML frontmatter + progressive-disclosure body + references) that teaches any agent to call the mesh over MCP and pay per call; portable across Claude Code, Cowork, Codex, Cursor, and Gemini CLI.\n\n**Plugin** \u2014 a **.claude-plugin/** manifest (marketplace + plugin) installable via /plugin marketplace add, bundling the skill and the MCP server.\n\n**Connector** \u2014 the live MCP endpoint added to claude.ai or Cowork as a custom connector over OAuth 2.1. One mesh, four front doors \u2014 see [[A2A Discovery]] for the peer-agent surface. A fifth door: **MCPB** \u2014 an mcpb/manifest.json in the kit packages the control plane as a one-click Claude Desktop extension (mcpb pack \u2192 .mcpb)."},
  {slug:"foundry",title:"The Foundry",group:"improve",sys:"improve",tags:["maos","factory","self-build"],body:"# The Foundry\nOpenMesha can build **other Metacognitive Agentic Operating Systems like itself** \u2014 from a single operator prompt (voice or text), inside the running system.\n\nThe operator describes an OS (\u201ca compliance mesh for SOC2 evidence\u201d, \u201ca post-quantum migration OS\u201d). The Foundry classifies the domain, then **composes a blueprint** from OpenMesha\u2019s pattern language: kernel slots, metered [[x402 Payments]] tools, kernel-verified outcome fees, eight console pages, and the full governance stack \u2014 the [[Human-on-the-Loop]] control tower and kill switch, [[AgentFence Security]] two-layer defense \u2014 transplanted and specialized. The child inherits the parent\u2019s **metacognition** too: production-readiness self-scoring, Petri safety seeds, a self-generated audit battery, a self-documenting galaxy, and drift fingerprints.\n\nEvery blueprint is **self-verified** against the invariants that make something a MAOS before it is offered. What runs live in-browser is genuine specification, scaffolding, pricing, and packaging; the heavy **compile + enterprise deploy** (extraction builder \u2192 battery generation \u2192 CI/CD, IaC, HA, multi-tenancy) is the control-plane WIRE \u2014 the same [[Human-on-the-Loop]] Hardening Backlog, pointed at a newborn system. Doctrine carries forward unbroken: money only through a human, knowledge append-only, outcome fees only where the new kernel verifies the result. The Foundry is itself a revenue surface \u2014 blueprint compiles and build-agent provisioning are metered, and a deploy **outcome fee** settles only when the emitted kit passes its own battery, so even the factory obeys the outcome-fee doctrine."},
  {slug:"monetization-map",title:"Monetization Map",group:"economy",sys:"commerce",tags:["revenue","pricing","layers"],body:"# Monetization Map\nThe canonical index of every revenue stream in the mesh \u2014 three stacked layers, each de-risking the one above.\n\n**Layer 1 \u00b7 Usage.** Nineteen metered endpoints across ten families \u2014 routing, memory, agents, council, swarm, compute, kernels ([[Kernel Forge]]), quantum ([[Agentic Quantum]]), security, gateway, tracing, knowledge, venture, and the agent reachability triad (identity.provision \u00b7 inbox.message \u00b7 voice.minute) \u2014 all billed per call through [[x402 Payments]], no invoices, no accounts.\n\n**Layer 2 \u00b7 Outcomes.** Six endpoints carry success fees that settle only on verified criteria (QAOA cut ratios, quantum-beats-classical, correct \u22651.2\u00d7 kernels, approved diffs, confirmed findings, arbitrage thresholds) with hash-stamped append-only receipts. The doctrine: outcome fees exist only where the kernel verifiably controls the result \u2014 which is why the reachability triad deliberately has none.\n\n**Layer 3 \u00b7 Base.** Free / Pro / Team / Enterprise subscriptions cover fixed costs, and governance \u2014 spend caps, [[Human-on-the-Loop]] approvals \u2014 is subscription-only by design: money never moves per-use.\n\nDistribution multiplies through [[A2A Discovery]] surfaces and [[Marketplaces]]; efficiency dividends from [[Compute Arbitrage]] stack beneath everything. A deliberately **unmetered tier** sits beneath all three: [[Local Inference]] on the user\u2019s own GPU \u2014 zero marginal cost, monetized only indirectly (routing dividend, privacy, offline capability). Every stream on this page is a live number elsewhere in the mesh \u2014 this star is the index, the ledgers are the truth. The map also lives as a console page (Economy \u2192 Monetization Map): a tap-to-navigate flow graph fed by the same ledgers. In the galaxy, this star\u2019s wikilink degree makes it the visible hub of the economic cluster. The console page itself now renders the economy Obsidian-style too: a draggable force graph whose node mass tracks live endpoint counts, with its own econ-graph.json export beside the pipeline view. **Growth streams** extend the map into the network-effect layer: **a2a settlement** fees on peer-agent transactions, marketplace listings with an honest rake, **attestation** (know-your-agent trust scoring), anonymized routing **benchmarks** as a data flywheel, and the quantum-era wedge \u2014 **pqc** readiness scans against the ~$15B HNDL-driven migration (FIPS 203/204/205; discovery alone runs 12\u201324 months, which is exactly agent-shaped work). Two new outcome fees clear the honesty bar because the kernel verifies them itself: **certified safety** (audit.certify settles only on Petri fitness \u2265 0.8) and **hardening.improve** (settles only on a verified PRS delta \u2265 +5). Rejected on doctrine: token emissions, sale of user data, and engagement-farmed pricing \u2014 growth compounds through the settlement graph, not extraction. The **Foundry** meters itself too: **foundry.blueprint** per compile and **foundry.provision** per build-agent, plus a **foundry.deploy** outcome fee that settles only when an emitted sibling-OS kit passes its own generated battery \u2014 the factory refuses payment for an OS that fails its own tests. The marketplace rake now has a researched benchmark: Apify\u2019s Actor Store runs the working 80/20 creator split (MCPize competes at 85/15), its rental model retires in October 2026 \u2014 vindicating OM\u2019s no-flat-fee doctrine \u2014 and its per-agent budget cap (ACTOR_MAX_TOTAL_CHARGE_USD) is the industry independently converging on [[Human-on-the-Loop]] spend caps. OM\u2019s stance: creator share \u2265 85%, competing on x402-native per-call settlement; the Apify MCP server also mounts directly as an upstream connector.\n\n**2026 hardening streams** joined the map: **qpu.dispatch** \u2014 markup on mounted QPU time, the [[Compute Arbitrage]] pattern extended to quantum hardware, metered off-chain and batch-netted \u2014 plus **skill.sign** and **mount.scan**, the [[Marketplaces]] supply-chain gate sold as a service, and **pqc.migrate**: a tenth outcome fee that settles only when a CBOM row on the [[PQC Migration OS]] verifiably flips to hybrid (ML-DSA-65 loaded and self-verified in-kernel). Rows the kernel doesn\u2019t control refuse the fee \u2014 the doctrine holds.\n\n**Leverage pack (Jul 2026).** attest.agent grew tiers \u2014 basic 0.15 \u00b7 **attest.score 0.75** (receipt-backed: trust, verified outcomes, posture, spend discipline) \u00b7 enterprise underwriting subscription-only \u2014 the third-party scoring layer ERC-8004 explicitly invites. **bench.query went free** (directories rank free availability; routing intel monetizes as an annual data subscription instead \u2014 DATA_SUB, WIRE). PQC repriced on regulation: scan **0.20**, migrate 0.15 metered / **4.50 outcome**; hardening.improve **3.50** after the ClawHavoc/ToxicSkills wave, now bundled as **skill:supplychain.harden**. The Foundry packages **three tiers** ($5 outcome floor \u2192 $25k\u2013$250k/yr deployment \u2192 2.5% settlement-graph share). Settlement runs **dual-rail** (base primary \u00b7 solana secondary \u00b7 fiat WIRE) over the existing deposit + batch-netting ledger, and telemetry ships as **audit.export** compliance packs (EU AI Act \u00b7 NIS2). Router seam moved to **LiteLLM + OpenRouter** \u2014 TensorZero archived Jun 2026.\n\n**Research layer (Jul 2026).** Sections 1\u20135 of the deep-research pass now live in-console as data the map reads: a marketplace **benchmark table** with listing sequence (Marketplaces), **wedge sizings** with honest analyst ranges (this page), the **settlement partner map** (x402 Commerce), the per-seam **production stack** registry (Settings), **QPU margin math** that argues for pass-through + 15% markup on real hardware (Quantum), and **pricing anchors** beside a subscription-only shelf \u2014 routing data sub, insurance feed, white-label license (Revenue). Figures carry ranges and dates; the map stays an index, the ledgers stay the truth."},
  {slug:"revenue",title:"Revenue Engine",group:"economy",sys:"econ",tags:["invoices","mrr"],body:"# Revenue Engine\nDaily revenue aggregates every metered call from the [[Commerce Rail]] plus marketplace listings. Invoices reconcile against the x402 transaction log; anomalies raise notifications and an entry in [[Distributed Tracing]]. Channel economics: streams add per venue, while agent-to-agent composition via [[A2A Discovery]] and [[x402 Payments]] is the compounding term."},
  {slug:"vc",title:"VC Pipeline",group:"economy",sys:"econ",tags:["deals","diligence"],body:"# VC Pipeline\nSourced → diligence → term sheet → closed, with council-scored conviction per deal. The [[LLM Council]] debates each check; wires move only after [[Human-on-the-Loop]] approval into [[Treasury]] escrow."},
  {slug:"gateway",title:"MCP Gateway",group:"gateway",sys:"gw",tags:["mcp","tools","skills"],body:"# MCP Gateway\nEvery internal capability is published as an MCP tool with schema, price and call count — metered through [[x402 Payments]]. SKILL.md bundles package procedures for reuse.\n\nExternal agents discover these tools via [[A2A Discovery]] and storefronts on [[Marketplaces]]. The gateway is bidirectional: OpenMesha also **mounts upstream MCP servers** \u2014 a Shopify storefront's /api/mcp, a 31-tool admin wrapper \u2014 turning external platforms into tool sources for the mesh's own agents.\n\nUpstream mounts now pass **scan-on-ingest** before their tools reach an agent \u2014 the same supply-chain gate that signs and pins the mesh\u2019s own listings on [[Marketplaces]]. The Qiskit QPU mount on [[Quantum Solvers]] is the first wired example."},
  {slug:"marketplaces",title:"Marketplaces",group:"gateway",sys:"gw",tags:["listings","distribution"],body:"# Marketplaces\nDistribution surfaces where the mesh sells: tool directories, agent stores, data exchanges. Venues span enterprise catalogs (AgentExchange, AWS, Microsoft, Gemini Enterprise, Claude Marketplace), developer stores (Apify, skills.sh, Agensi, MCP Registry) and decentralized networks (Agentverse, Virtuals). Listing views convert into [[Commerce Rail]] calls; placement is optimized by the [[Self-Improvement Loop]]. In June 2026 **okx**.AI opened the first exchange-grade agent economy: an Agent Marketplace (builders list agents and earn) joined to a Task Marketplace (pay only on delivered results), with two settlement modes \u2014 **escrow** contracts for complex multi-step work and instant pay-per-call for standardized services \u2014 under one persistent onchain identity. Its pay-per-call mode is OpenMesha\u2019s x402 thesis validated by a $25B player; its **onchain os** toolkit (EVM + Solana, no account required) distributes skills straight into Claude Code, the same channel this kit\u2019s SKILL.md ships through. Listing OM\u2019s provisioned agents there as service providers is a live WIRE; portable receipt-backed reputation is what the [[Monetization Map]]\u2019s attest.agent stream was priced for. One doctrinal contrast stands: OKX resolves disputes by a staked evaluator network \u2014 here, disputes end at [[Human-on-the-Loop]] until machine arbitration earns that trust.\n\nListings now clear a **supply-chain gate**: every published SKILL.md is digest-hashed (SHA-256) and Sigstore-signed with pinned dependencies, and upstream mounts are scanned on ingest \u2014 the OWASP Agentic-Skills answer to 2026\u2019s marketplace-cleared malicious skills, dead-dependency SkillJacking, and SSRF-prone servers. Unsigned or floating listings are gated from republish."},
  {slug:"discovery",title:"A2A Discovery",group:"gateway",sys:"gw",tags:["a2a","handshake"],body:"# A2A Discovery\nAgent-to-agent handshakes: peers advertise capability cards with trust scores; the mesh negotiates scope, price and audit terms before delegating. Untrusted peers are sandboxed behind [[AgentFence Security]].\n\nDiscovery is now a **layered stack**: A2A agent cards, AGNTCY's content-addressed directory, NANDA's verifiable index and the MCP registry resolve *who can do what*; identity rails (Entra Agent ID, Visa TAP, ERC-8004) prove *who is asking*; [[x402 Payments]] settles *what it costs*. Agents also carry a **reachability triad** \u2014 an x402 wallet with a daily cap under [[Human-on-the-Loop]], a provisioned inbox, and a phone number \u2014 and every inbound message is screened by [[AgentFence Security]] before an agent reads it. Each leg is itself metered \u2014 provisioning, messages, minutes \u2014 through [[x402 Payments]]; caps and approvals stay subscription-only. Discovery is fed by three live-generated **publish surfaces** \u2014 the agent card at /.well-known/agent.json, an mcp.json descriptor, and llms.txt \u2014 copy-ready for registries. The card dual-publishes at the **A2A v1.0** canonical path /.well-known/agent-card.json (legacy agent.json kept), declares the eight-state task lifecycle (submitted \u00b7 working \u00b7 input_required \u00b7 auth_required \u00b7 completed \u00b7 failed \u00b7 canceled \u00b7 rejected), and its x402 accepts carry **CAIP-2** chain IDs (eip155:8453) tracking protocol v2.\n\nAbove settlement, the **AP2 mandate layer** turns approvals into signed authorization artifacts \u2014 payment-agnostic intent/cart mandates minted at the [[Human-on-the-Loop]] gate."},
  {slug:"settings",title:"Mission Settings",group:"system",sys:"system",tags:["fleet","locale","local","persistence"],body:"# Mission Settings\nThe console\u2019s control room: fleet automation flags, locale, persistence (versioned migrations with corpus-signature wiki merges), and the local-model dock \u2014 where [[Local Inference]] loads WebGPU models that register as ~zero-cost arms on the [[Model Router]].\n\nSettings never move money \u2014 spend stays behind [[Human-on-the-Loop]] regardless of any flag set here."},
  {slug:"localization",title:"Localization",group:"system",sys:"system",tags:["i18n","locales"],body:"# Localization\nThe shell ships English, Spanish and Japanese string tables; locale switches live and persists. The [[Voice Copilot]] inherits the active locale for speech synthesis where the browser voice supports it."},
];
/* ── Corpus versioning: the shipped WIKI evolves; approved copilot diffs survive.
     Any corpus change flips the signature and triggers a merge on next load. ── */
const WIKI_SIG=WIKI.length+"."+sha(WIKI.map(p=>p.slug+":"+p.body.length).join("|")).slice(0,10);
function mergeWiki(savedPages){
  const fresh=WIKI.map(p=>({...p}));
  if(!savedPages||!savedPages[0]||!savedPages[0].sys)return fresh;
  const bySlug={};savedPages.forEach(p=>{if(p&&p.slug)bySlug[p.slug]=p;});
  fresh.forEach(p=>{const sp=bySlug[p.slug];if(!sp||typeof sp.body!=="string")return;
    const i=sp.body.indexOf("\n\n**Copilot update");
    if(i>=0){const suffix=sp.body.slice(i).replace(/AXIOM/g,"OpenMesha").replace(/QMX/g,"OM");if(!p.body.endsWith(suffix))p.body+=suffix;}});
  return fresh;
}


/* ── Treasury derivations — runway & yield read live state, never seeded.
   Runway = gross-burn basis (treasury ÷ spend·30.44): the revenue-off scenario.
   Yield bucket = allocation slot; its return stream is display-derived from
   YIELD_POLICY.apy (sim-marked) until the control-plane feed hydrates.
   WIRE: GET /api/treasury/yield → {apy, accruedToday}. Nothing accrues into
   the ledger without settlement through Human-on-the-Loop. ── */
const YIELD_POLICY={apy:0.045,label:"4.5% policy APY",endpoint:"/api/treasury/yield"};
function runwayFrom(treasury,dailySpend){const total=(treasury||[]).reduce((a,b)=>a+(b.value||0),0);const burn=(dailySpend||0)*30.44;return burn>0?Math.max(0,Math.round(total/burn)):999;}
function initialState(){
  const treasury0=[{name:"Operating",value:2_400_000},{name:"Escrow",value:1_100_000},{name:"Reserve",value:5_600_000},{name:"Yield",value:900_000}];
  return {
    vitals:{uptime:0,reqs:0, cpu:0.42, mesh:0.98},
    treasury:treasury0,
    revenueToday:38_400, spend:12_900, runwayMonths:runwayFrom(treasury0,12_900),
    deals:DEALS.slice(),
    hotl:[{id:uid("h"),action:"Approve $1,500 data purchase",amount:1500,kind:"data",risk:"medium"},{id:uid("h"),action:"Fund Vela Robotics into escrow",amount:2_500_000,kind:"vc",risk:"high"}],
    councilRuns:[{id:uid("c"),proposal:"Adopt sovereign voice profile as default",consensus:0.82,votes:{yes:4,no:1,abstain:1}}],
    goals:[{id:uid("g"),text:"Grow x402 metered revenue 20%",status:"running",steps:7}],
    activity:[], notifs:[{id:uid("n"),kind:"hotl",text:"New approval required: Fund Vela Robotics",read:false}],
    wikiPages:WIKI.slice(),
    wikiSync:now(),
    rkiSources:QK.rkiSources().length, rkiExperiences:QK.rkiExperiences(),
    locale:"en",
  };
}
function reducer(s,a){
  switch(a.type){
    case "TICK": return {...s,vitals:{...s.vitals,uptime:s.vitals.uptime+1,reqs:s.vitals.reqs+((Math.random()*6)|0),cpu:clamp(s.vitals.cpu+rnd(-0.03,0.03),0.1,0.95)}};
    case "ACT": {const ev={id:uid("ev"),ts:now(),...a.ev};const activity=[ev,...s.activity].slice(0,60);return {...s,activity};}
    case "PJ_WIKI_MERGE": {const keep=(s.wikiPages||[]).filter(p=>!(p.slug&&p.slug.indexOf("pj-")===0));return {...s,wikiPages:[...keep,...(a.pages||[])]};}
    case "OMRSI_WIKI_MERGE": {const MK="\n\n**\u27e6OM-RSI \u00b7 live governance\u27e7**";const at=a.attach||{};let wp=(s.wikiPages||[]).map(p=>at[p.slug]!=null?{...p,body:p.body.split(MK)[0]+MK+"\n\n"+at[p.slug]}:p);const have=new Set(wp.map(p=>p.slug));for(const np of (a.pages||[])){if(have.has(np.slug)){wp=wp.map(p=>p.slug===np.slug?{...p,body:np.body}:p);}else{wp=[...wp,np];}}return {...s,wikiPages:wp,wikiSync:now()};}
    case "NOTIFY": return {...s,notifs:[{id:uid("n"),read:false,...a.n},...s.notifs].slice(0,30)};
    case "READ_NOTIFS": return {...s,notifs:s.notifs.map(n=>({...n,read:true}))};
    case "REVENUE": return {...s,revenueToday:s.revenueToday+ (a.amount||0)};
    case "ADD_GOAL": return {...s,goals:[{id:uid("g"),...a.goal},...s.goals].slice(0,20)};
