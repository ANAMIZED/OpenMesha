startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      llmMode:
        type: string
        default: mock
  exampleConfig:
    llmMode: mock
  commandFunction: |
    (config) => ({
      command: 'python',
      args: ['-m', 'openmesha.mcp.server'],
      env: { OM_LLM_MODE: config.llmMode || 'mock' }
    })
